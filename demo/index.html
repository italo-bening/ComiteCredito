<!-- Faixa vermelha de erro: primeiro script, separado do resto -->
<script>
(function () {
  var caixa = null;
  function ctx() { try { return window.__ctx ? window.__ctx() : {}; } catch (e) { return {}; } }
  function mostrar(msg) {
    var c = ctx(), agora = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    var det = 'Mensagem: ' + msg +
      '\nVersão da tela: ' + (c.versaoTela || '?') + ' \u00b7 Versão do servidor: ' + (c.versao || '?') +
      '\nE-mail: ' + (c.email || '?') + '\nAcesso: ' + (c.acesso || '?') +
      '\nDia e hora: ' + p(agora.getDate()) + '/' + p(agora.getMonth() + 1) + '/' + agora.getFullYear() + ' ' + p(agora.getHours()) + ':' + p(agora.getMinutes());
    if (!document.body) { document.addEventListener('DOMContentLoaded', function () { mostrar(msg); }); return; }
    if (!caixa) {
      caixa = document.createElement('div');
      caixa.setAttribute('role', 'alert');
      caixa.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b42318;color:#fff;padding:12px 16px;font:14px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3)';
      caixa.innerHTML = '<div style="max-width:1140px;margin:0 auto"><div style="display:flex;gap:12px;align-items:flex-start">' +
        '<div style="flex:1"><b>Algo deu errado na página.</b> Mande um print desta mensagem (ou cole os detalhes) para o desenvolvedor.</div>' +
        '<button type="button" data-x="copiar" style="background:#fff;color:#b42318;border:0;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer">Copiar detalhes</button>' +
        '<button type="button" data-x="fechar" aria-label="Fechar" title="Fechar" style="background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1">&times;</button></div>' +
        '<pre data-x="det" style="margin:10px 0 0;background:rgba(0,0,0,.35);padding:10px 12px;border-radius:10px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Consolas,monospace"></pre></div>';
      document.body.appendChild(caixa);
      caixa.addEventListener('click', function (ev) {
        var x = ev.target.getAttribute('data-x');
        if (x === 'fechar') { caixa.remove(); caixa = null; }
        if (x === 'copiar') {
          var pre = caixa.querySelector('[data-x="det"]');
          var sel = function () { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
          try { navigator.clipboard.writeText(pre.textContent).then(function () { ev.target.textContent = 'Copiado'; }, sel); } catch (e) { sel(); }
        }
      });
    }
    caixa.querySelector('[data-x="det"]').textContent = det;
  }
  window.mostrarErro = mostrar;
  window.addEventListener('error', function (e) { mostrar((e && e.message) || 'Erro desconhecido'); });
  window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; mostrar((r && r.message) || String(r)); });
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>

<style>
:root {
  color-scheme: light;
  --primary: #0d6532; --g2: #7cc242; --warn: #f4c21b; --done: #1f9d55; --danger: #d64545; --info: #3b6cf0;
  --bg: #fbfbf7; --fg: #16211a; --muted: #5b6760; --subtle: #8b958f;
  --border: #e4e7df; --card: #ffffff; --surface: #f3f5ee; --hover: #ebeee6;
  --primary-deep: color-mix(in srgb, var(--primary) 45%, #000);
  --primary-soft: color-mix(in srgb, var(--primary) 9%, var(--card));
  --primary-line: color-mix(in srgb, var(--primary) 24%, var(--card));
  --blur: 14px;
  --glass: color-mix(in srgb, var(--bg) 72%, transparent);
  --glass-line: color-mix(in srgb, #fff 55%, transparent);
  --r: 12px; --r-btn: calc(var(--r) * .7); --r-input: calc(var(--r) * .85); --r-card: calc(var(--r) + 4px); --r-lg: calc(var(--r) * 2); --pill: 999px;
  --sh-float: 0 20px 50px -20px rgba(16, 60, 34, .35);
  --sh-card: 0 10px 30px -18px rgba(16, 40, 26, .28);
  --sh-hover: 0 6px 18px -8px rgba(0, 0, 0, .18);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --grad: radial-gradient(90% 260% at 85% 0%, color-mix(in srgb, var(--primary) 60%, #000) 0%, transparent 60%),
          linear-gradient(160deg, var(--primary-deep), color-mix(in srgb, var(--primary) 26%, #000));
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c120f; --fg: #e7efe9; --muted: #9aaba1; --subtle: #6b7b72;
  --border: #223029; --card: #131b17; --surface: #18221d; --hover: #1f2b25;
  --primary-soft: color-mix(in srgb, var(--primary) 20%, var(--card));
  --primary-line: color-mix(in srgb, var(--primary) 45%, var(--card));
  --glass-line: color-mix(in srgb, #fff 10%, transparent);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.cap { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- topo ---------- */
header.top { position: sticky; top: 0; z-index: 40; }
.topbar { position: relative; z-index: 3; color: #fff; background: var(--grad); border-bottom: 1px solid rgba(255, 255, 255, .14); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.logo { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .16); border-radius: var(--r-input); color: #fff; text-decoration: none; font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.logo svg { width: 24px; height: 26px; display: block; }
.sis { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 0 0 12px; border: 0; border-left: 1px solid rgba(255, 255, 255, .25); background: none; color: #fff; font-size: 15px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.sis[disabled] { cursor: default; }
.sis .chev { color: var(--g2); font-size: 12px; }
.grow { flex: 1; }
.pill-ag { background: rgba(0, 0, 0, .45); border-radius: var(--pill); padding: 4px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.devbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px dashed var(--g2); border-radius: var(--r-btn); color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; }
.devbtn:hover { background: rgba(255, 255, 255, .08); }
.ibtn { width: 36px; height: 36px; flex: none; display: inline-grid; place-items: center; border-radius: var(--r-btn); border: 1px solid rgba(255, 255, 255, .12); background: rgba(0, 0, 0, .28); color: #fff; }
.ibtn:hover { background: rgba(0, 0, 0, .4); }
.ibtn.lua { color: var(--g2); }
.ibtn.gira svg { animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.userbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 4px; border: 0; border-radius: var(--pill); background: rgba(255, 255, 255, .12); color: #fff; font-weight: 600; }
.userbtn .chev { color: var(--g2); font-size: 11px; }
.av { width: 28px; height: 28px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--g2); color: #0b2a17; font-size: 11.5px; font-weight: 800; }
.mwrap { position: relative; }
@media (max-width: 860px) { .devbtn { display: none; } }
@media (max-width: 600px) { .logo span, .userbtn .nm, .userbtn .chev { display: none; } .userbtn { padding: 0 4px; } .topbar .wrap { gap: 6px; } .pill-ag { display: none; } }

/* ---------- menus ---------- */
.menu { position: absolute; top: calc(100% + 8px); width: 300px; max-width: calc(100vw - 24px); z-index: 50; padding: 8px; color: var(--fg);
  background: color-mix(in srgb, var(--card) 97%, transparent); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh-float); animation: desce .18s ease; }
.menu.esq { left: 0; } .menu.dir { right: 0; }
@keyframes desce { from { opacity: 0; transform: translateY(-6px); } }
.menu .grp + .grp { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
.menu .cap { padding: 6px 8px 4px; }
.mi { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px; border: 0; border-radius: var(--r-btn); background: none; text-align: left; text-decoration: none; color: var(--fg); }
.mi:hover { background: var(--hover); }
.mi .ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: var(--r-btn); background: var(--primary-soft); color: var(--primary); }
.mi.on .ic { background: var(--primary); color: #fff; }
.mi .tx { flex: 1; min-width: 0; }
.mi .tx b { display: block; font-weight: 600; }
.mi .tx small { display: block; color: var(--muted); font-size: 12.5px; }
.mi .ok { color: var(--primary); }
.me { display: flex; gap: 10px; align-items: center; padding: 8px; }
.me .av { width: 40px; height: 40px; font-size: 14px; }
.me b { display: block; }
.me .em { color: var(--muted); font-size: 12.5px; word-break: break-all; }
.me .ac { color: var(--primary); font-weight: 600; font-size: 12.5px; }
:root[data-theme="dark"] .me .ac { color: var(--g2); }
.vcform { display: flex; gap: 6px; padding: 4px 8px 8px; flex-wrap: wrap; }
.vcform select { flex: 1; min-width: 100px; }

/* ---------- abas ---------- */
.tabsbar { position: relative; z-index: 1; background: var(--glass); backdrop-filter: blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); border-bottom: 1px solid var(--border); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav button { display: inline-flex; align-items: center; gap: 8px; padding: 13px 14px 11px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
.nav button:hover { color: var(--fg); }
.nav button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
:root[data-theme="dark"] .nav button[aria-selected="true"] { color: var(--g2); border-bottom-color: var(--g2); }
.cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--pill); background: var(--primary-deep); color: #fff; font-size: 11px; font-weight: 700; }

/* ---------- faixa Ver como ---------- */
.vcbar { background: color-mix(in srgb, var(--warn) 24%, var(--bg)); border-bottom: 1px solid color-mix(in srgb, var(--warn) 60%, transparent); }
.vcbar .wrap { display: flex; align-items: center; gap: 10px; padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
.vcbar .tx { flex: 1; min-width: 200px; }

/* ---------- conteúdo ---------- */
main { flex: 1; padding: 20px 0 32px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh-card); padding: 16px 18px; }
h2.tit { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }

/* ---------- estados ---------- */
.estado { max-width: 560px; margin: 40px auto; padding: 32px 24px; text-align: center; background: var(--surface); border-radius: var(--r-card); }
.estado .bol { width: 52px; height: 52px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 50%; background: var(--card); box-shadow: var(--sh-card); font-size: 20px; }
.estado h2 { margin: 0 0 6px; font-size: 18px; }
.estado p { margin: 0 0 6px; color: var(--muted); }
.anel { width: 26px; height: 26px; border: 3px solid var(--primary-line); border-top-color: var(--primary); border-radius: 50%; animation: gira .8s linear infinite; }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--r-btn); font-size: 14px; font-weight: 600; white-space: nowrap; transition: opacity .2s, background .2s, box-shadow .2s; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-outline { background: var(--card); border-color: var(--border); color: var(--fg); }
.btn-outline:hover { background: var(--hover); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--hover); color: var(--fg); }
.btn-danger, .btn.confirmar { background: var(--danger); color: #fff; border-color: transparent; }
.btn.confirmar { animation: treme .35s; }
@keyframes treme { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn-lg { height: 46px; padding: 0 22px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.pillbtn { border-radius: var(--pill); }

/* ---------- chips e etiquetas ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--pill); background: var(--card); color: var(--fg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip[disabled] { opacity: .5; cursor: not-allowed; }
.chip .cnt { background: rgba(0, 0, 0, .18); height: 18px; min-width: 18px; }
.chip.nok[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--pill); font-size: 11px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; background: var(--surface); color: var(--muted); }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.info { background: color-mix(in srgb, var(--info) 13%, var(--card)); color: var(--info); }
.tag.wait { background: color-mix(in srgb, var(--warn) 22%, var(--card)); color: color-mix(in srgb, var(--warn) 55%, #000); }
:root[data-theme="dark"] .tag.wait { color: var(--warn); }
.tag.ok { background: color-mix(in srgb, var(--done) 14%, var(--card)); color: var(--done); }
.tag.no { background: color-mix(in srgb, var(--danger) 13%, var(--card)); color: var(--danger); }
.tag.plain::before { display: none; }
.selo { display: inline-block; padding: 0 7px; border-radius: var(--pill); background: var(--primary-soft); border: 1px solid var(--primary-line); color: var(--primary); font-size: 11px; font-weight: 700; }

/* ---------- lista de operações ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.busca { position: relative; flex: 1; min-width: 200px; }
.busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--subtle); }
.busca input.in { padding-left: 36px; }
.lista { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 14px; align-items: center; width: 100%; padding: 14px 16px; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh-card); transition: box-shadow .2s, transform .2s; color: var(--fg); }
.item:hover { box-shadow: var(--sh-hover); transform: translateY(-1px); }
.item .nro { flex: none; width: 54px; text-align: center; font-weight: 800; color: var(--primary); }
:root[data-theme="dark"] .item .nro { color: var(--g2); }
.item .nro small { display: block; font-weight: 600; color: var(--subtle); font-size: 10.5px; }
.item .mid { flex: 1; min-width: 0; }
.item .mid b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .mid .sub { color: var(--muted); font-size: 12.5px; }
.item .dir { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .val { font-weight: 700; }
.item .prox { font-size: 12px; color: var(--muted); }
.item.tarefa { border-color: var(--primary-line); box-shadow: inset 4px 0 0 var(--g2), var(--sh-card); }
@media (max-width: 600px) { .item { flex-wrap: wrap; } .item .dir { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; } .item .nro { width: auto; } }
.vazio { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border-radius: var(--r-card); }

/* ---------- formulário ---------- */
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo label, .campo .lb { font-size: 13px; font-weight: 600; color: var(--muted); }
.campo .ob { color: var(--danger); }
input.in, select.in, textarea.in { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-input); background: var(--card); transition: border-color .2s, box-shadow .2s; }
textarea.in { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; }
.in:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 16%, transparent); }
.in.cheio { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.campo.erro label, .campo.erro .lb { color: var(--danger); }
.campo.erro .in { border-color: var(--danger); }
.msgerro { display: flex; gap: 6px; align-items: center; color: var(--danger); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.grid3 { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 10px; align-items: end; }
.full { grid-column: 1 / -1; }
@media (max-width: 600px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.secao { background: var(--surface); border-radius: var(--r-card); padding: 14px; }
.secao.erro { box-shadow: 0 0 0 2px var(--danger); }
.secao > .hd { display: flex; align-items: center; gap: 10px; margin: 2px 4px 12px; }
.secao > .hd .bola { width: 10px; height: 10px; border-radius: 50%; background: var(--g2); }
.secao > .hd h3 { flex: 1; }
.contador { padding: 2px 10px; border-radius: var(--pill); background: var(--card); border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
.contador:empty { display: none; }
.contador.ok { background: var(--done); border-color: var(--done); color: #fff; }
.secao > .bx { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; }
.barra { height: 6px; border-radius: var(--pill); background: var(--surface); overflow: hidden; }
.barra > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--g2)); border-radius: var(--pill); transition: width .4s; }
.chk { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-btn); cursor: pointer; }
.chk:hover { background: var(--hover); }
.chk input { width: 18px; height: 18px; accent-color: var(--primary); flex: none; }
.chk.erro { color: var(--danger); }
.linha { display: grid; gap: 10px; padding: 10px; background: var(--surface); border-radius: var(--r-input); margin-bottom: 8px; }
.form-acoes { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; padding: 12px 0; background: linear-gradient(transparent, var(--bg) 35%); }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-card); background: color-mix(in srgb, var(--warn) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
.aviso.no { background: color-mix(in srgb, var(--danger) 10%, var(--card)); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

/* ---------- indicador de passos ---------- */
.passos { display: flex; align-items: flex-start; }
.passo { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; gap: 6px; min-width: 0; }
.passo::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 3px; background: var(--border); z-index: 0; }
.passo:first-child::before { display: none; }
.passo.feito::before, .passo.atual::before { background: linear-gradient(90deg, var(--primary), var(--g2)); }
.passo .c { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--muted); font-weight: 700; border: 2px solid var(--border); }
.passo.feito .c { background: var(--primary); border-color: var(--primary); color: #fff; }
.passo.atual .c { background: var(--card); border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 5px color-mix(in srgb, var(--primary) 16%, transparent); }
.passo b { font-size: 13px; }

  const S = (new Function(Object.keys(M).join(','), "/* Comitê de Crédito CrediBrás\n * Operações de crédito do cooperado:\n *   Atendente (mesa de negócios + checklist) > Análise > Gerente (IAP e voto) > Diretoria > Liberação (atendente)\n *\n * Histórico\n *   1  Primeira versão: operações de crédito com checklist da solicitação, análise com checklist\n *      (capacidade de pagamento etc.), IAP e voto do gerente, decisão da diretoria e liberação pela agência;\n *      pessoas e tipos de usuário, Trocar de acesso, Ver como, links e atalhos do dev.\n *   2  Sem CPF do cooperado (só a conta); avalista e garantia só sim/não; parecer da análise opcional;\n *      gerente envia com voto favorável automático; diretoria ganha \"Análise estendida\"; devolver sem motivo;\n *      ordem de chegada (coluna chegada) para a fila de cada etapa.\n *   3  \"Análise estendida\" vira \"Aprovação posterior\" (a diretoria decide outro dia; no dia seguinte volta para a fila);\n *      \"Reprovada\" vira \"Negada\"; getData devolve o dia de hoje para a fila da diretoria.\n */\nconst VERSAO = 3;\nconst VERSAO_DATA = '07/11/2026 16:25';   // dia/mês/ano hora:minuto da publicação (horário de Rondônia)\n\nconst NOME_SISTEMA = 'Comitê de Crédito';\nconst FUSO = 'America/Porto_Velho';\nconst AGENCIAS = ['Matriz', '001', '002', '003', '004'];\n\n// ---------- ícone da aba do navegador (arquivo no Drive compartilhado como \"Qualquer pessoa com o link\") ----------\nconst FAVICON_URL = 'https://drive.google.com/file/d/1n77pd6-pobbzkxi6LUGdvX74AiuKuWPQ/view?usp=sharing';\n\n// ---------- caminho da operação ----------\nconst ST = {\n  RASCUNHO: 'Rascunho',          // atendente preenchendo\n  ANALISE: 'Em análise',         // analista\n  PENDENTE: 'Pendente',          // análise (ou gerente) devolveu ao atendente para corrigir\n  GERENTE: 'Com o gerente',      // gerente inclui o IAP e vota\n  DIRETORIA: 'Na diretoria',     // diretoria aprova\n  POSTERIOR: 'Aprovação posterior', // diretoria vai decidir em outro dia\n  APROVADA: 'Aprovada',          // atendente libera\n  LIBERADA: 'Liberada',          // fim\n  NEGADA: 'Negada',              // fim\n  CANCELADA: 'Cancelada'         // dá para reativar\n};\nconst STATUS = Object.keys(ST).map(k => ST[k]);\nconst PREPARO = [ST.RASCUNHO, ST.PENDENTE];\nconst CANCELAVEIS = [ST.RASCUNHO, ST.PENDENTE, ST.ANALISE, ST.GERENTE, ST.DIRETORIA, ST.POSTERIOR];\nconst NA_DIRETORIA = [ST.DIRETORIA, ST.POSTERIOR];\n\n// ---------- listas da tela ----------\nconst MODALIDADES = ['Crédito pessoal', 'Capital de giro', 'Financiamento de veículo', 'Crédito rural',\n  'Consignado', 'Cheque especial', 'Antecipação de recebíveis', 'Investimento', 'Outra'];\nconst CHECK_SOLICITACAO = [\n  { id: 'spc', nome: 'Consulta SPC/Serasa', obrig: true },\n  { id: 'scr', nome: 'Consulta SCR (Banco Central)', obrig: true },\n  { id: 'cadastro', nome: 'Cadastro do cooperado atualizado', obrig: true },\n  { id: 'renda', nome: 'Comprovante de renda ou faturamento', obrig: true },\n  { id: 'documentos', nome: 'Documentos pessoais conferidos', obrig: true },\n  { id: 'proposta', nome: 'Proposta assinada pelo cooperado', obrig: false }\n];\nconst CHECK_ANALISE = [\n  { id: 'capacidade', nome: 'Capacidade de pagamento' },\n  { id: 'restricoes', nome: 'Restrições cadastrais (SPC/Serasa)' },\n  { id: 'endividamento', nome: 'Endividamento (SCR)' },\n  { id: 'garantias', nome: 'Garantias suficientes' },\n  { id: 'documentacao', nome: 'Documentação completa' }\n];\nconst RECOMENDACOES = ['Favorável', 'Favorável com ressalvas', 'Desfavorável'];\nconst RISCOS = ['AA', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];\n\n// ---------- planilha ----------\nconst ABAS = {\n  Operacoes: ['n', 'agencia', 'status', 'criado', 'atualizado', 'chegada', 'email', 'solicitante', 'cooperado', 'conta',\n    'numero_operacao', 'modalidade', 'valor', 'prazo', 'dados', 'checklist', 'analise', 'gerente', 'diretoria',\n    'liberacao', 'historico', 'excluida', 'rev'],\n  Usuarios: ['email', 'nome', 'agencia', 'perfil', 'ativo', 'acessos'],\n  Perfis: ['perfil', 'descricao', 'gerencia', 'tecnico', 'solicita', 'analisa', 'vota', 'aprova', 'libera'],\n  Atalhos: ['nome', 'link', 'descricao']\n};\nconst JSONS = { dados: {}, checklist: {}, analise: {}, gerente: {}, diretoria: {}, liberacao: {}, historico: [] };\n\n// ---------- tipos de usuário ----------\nconst PERMS = ['solicita', 'analisa', 'vota', 'aprova', 'libera'];\nconst PERM_INFO = {\n  solicita: 'Cadastra a operação e envia para análise',\n  analisa: 'Faz a análise da operação',\n  vota: 'Inclui o IAP e vota como gerente',\n  aprova: 'Aprova ou nega (diretoria)',\n  libera: 'Registra a liberação da operação aprovada'\n};\nconst FIXOS = ['usuario', 'admin', 'dev'];\nconst PERFIS_INICIAIS = [\n  ['usuario', 'Atendente: cadastra a operação, envia para análise e faz a liberação', 'não', 'não', 'sim', 'não', 'não', 'não', 'sim'],\n  ['admin', 'Atendente que também gerencia pessoas, tipos e links', 'sim', 'não', 'sim', 'não', 'não', 'não', 'sim'],\n  ['dev', 'Admin com acesso técnico (planilha e código) e todas as etapas', 'sim', 'sim', 'sim', 'sim', 'sim', 'sim', 'sim'],\n  ['analista', 'Analisa as operações e marca o checklist da análise', 'não', 'não', 'não', 'sim', 'não', 'não', 'não'],\n  ['gerente', 'Inclui o IAP, vota e envia para a diretoria', 'não', 'não', 'não', 'não', 'sim', 'não', 'não'],\n  ['diretoria', 'Aprova, nega ou devolve as operações', 'não', 'não', 'não', 'não', 'não', 'sim', 'não']\n];\n\n// =====================================================================================\n// Abrir a tela e ícone\n// =====================================================================================\nfunction doGet() {\n  const saida = HtmlService.createHtmlOutputFromFile('app')\n    .setTitle(NOME_SISTEMA + ' CrediBrás')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n  aplicarIcone_(saida);\n  return saida;\n}\n\n// aceita link do Drive (\".../file/d/ID/view\" ou \"...?id=ID\") e devolve o endereço direto da imagem\nfunction linkImagem_(link) {\n  const t = String(link || '').trim();\n  if (!t) return '';\n  const m = t.match(/\\/d\\/([\\w-]{20,})/) || t.match(/[?&]id=([\\w-]{20,})/);\n  if (m && /google\\.com/.test(t)) return 'https://lh3.googleusercontent.com/d/' + m[1];\n  return /^https:\\/\\//.test(t) ? t : '';\n}\n// o Google só aceita ícone com final de imagem: tenta com \"#.png\" e depois o endereço puro\nfunction aplicarIcone_(h) {\n  const ico = linkImagem_(FAVICON_URL);\n  if (!ico) return 'sem ícone configurado';\n  const tentativas = /\\.(png|ico|gif|jpe?g)(\\?|#|$)/i.test(ico) ? [ico] : [ico + '#.png', ico];\n  for (const u of tentativas) {\n    try { h.setFaviconUrl(u); return 'ok: ' + u; } catch (e) { /* tenta o próximo */ }\n  }\n  return 'o Google recusou o endereço: ' + ico;\n}\n// rode no editor para conferir no Registro de execução\nfunction testarIcone() {\n  Logger.log('Resultado: ' + aplicarIcone_(HtmlService.createHtmlOutput('teste')));\n}\n\n// =====================================================================================\n// Utilidades\n// =====================================================================================\nfunction ss_() { return SpreadsheetApp.getActive(); }\nfunction agora_() { return Utilities.formatDate(new Date(), FUSO, 'dd/MM/yyyy HH:mm'); }\nfunction hojeISO_() { return Utilities.formatDate(new Date(), FUSO, 'yyyy-MM-dd'); }\nfunction chegada_() { return Utilities.formatDate(new Date(), FUSO, 'yyyy-MM-dd HH:mm:ss'); }   // ordena a fila\nfunction norm_(e) { return String(e == null ? '' : e).toLowerCase().replace(/\\s+/g, ''); }\nfunction sim_(v) { return /^(sim|s|true|1|x|yes)$/i.test(String(v == null ? '' : v).trim()); }\nfunction nao_(v) { return /^(n|não|nao|false|0|no)$/i.test(String(v == null ? '' : v).trim()); }\nfunction seguro_(v) { return typeof v === 'string' && /^[=+\\-@]/.test(v) ? \"'\" + v : v; }   // nunca vira fórmula\nfunction ag_(v) {\n  const t = String(v == null ? '' : v).trim();\n  if (!t || /^matriz$/i.test(t)) return 'Matriz';\n  return /^\\d{1,3}$/.test(t) ? ('000' + t).slice(-3) : t;\n}\nfunction txt_(v, max, nome) {\n  const t = String(v == null ? '' : v).trim();\n  if (t.length > max) throw new Error(nome + ': máximo de ' + max + ' caracteres.');\n  return t;\n}\nfunction num_(v) {                                     // aceita 1234.56, \"1.234,56\" e \"R$ 1.234,56\"\n  if (typeof v === 'number') return isFinite(v) ? Math.round(v * 100) / 100 : 0;\n  const t = String(v == null ? '' : v).replace(/[^\\d,.-]/g, '');\n  const n = +(t.indexOf(',') >= 0 ? t.replace(/\\./g, '').replace(',', '.') : t);\n  return isFinite(n) ? Math.round(n * 100) / 100 : 0;\n}\nfunction https_(v) {\n  const t = String(v == null ? '' : v).trim();\n  return /^https:\\/\\/[^\\s\"'<>]+$/i.test(t) ? t : '';\n}\nfunction digitos_(v) { return String(v == null ? '' : v).replace(/\\D/g, ''); }\nfunction dataOk_(v) {\n  const m = String(v || '').match(/^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/);\n  if (!m) return false;\n  const d = new Date(+m[3], +m[2] - 1, +m[1]);\n  return d.getFullYear() === +m[3] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[1];\n}\nfunction nomePerfil_(p) {\n  const n = { usuario: 'Usuário', admin: 'Admin', dev: 'Dev' }[p];\n  return n || (String(p).charAt(0).toUpperCase() + String(p).slice(1)).replace(/_/g, ' ');\n}\nfunction labelAcesso_(a) {\n  return (a.agencia === 'Matriz' ? 'Matriz' : 'Agência ' + a.agencia) + ' · ' + nomePerfil_(a.perfil);\n}\nconst chave_ = a => a.agencia + '|' + a.perfil;\nconst clone_ = o => JSON.parse(JSON.stringify(o));\n\n// =====================================================================================\n// Planilha: tudo pelo NOME da coluna\n// =====================================================================================\nfunction aba_(nome) {\n  let s = ss_().getSheetByName(nome);\n  if (s) return s;\n  s = ss_().insertSheet(nome);\n  s.getRange(1, 1, 1, ABAS[nome].length).setValues([ABAS[nome]]).setFontWeight('bold');\n  s.setFrozenRows(1);\n  s.getRange('A:Z').setNumberFormat('@');              // texto: \"001\" continua \"001\", datas não viram data\n  return s;\n}\nfunction cab_(s) {\n  const c = s.getLastColumn();\n  return c ? s.getRange(1, 1, 1, c).getValues()[0].map(x => String(x).trim()) : [];\n}\nfunction garanteCab_(nome) {                          // acrescenta colunas que faltam, nunca apaga\n  const s = aba_(nome), h = cab_(s);\n  const falta = ABAS[nome].filter(k => h.indexOf(k) < 0);\n  if (falta.length) s.getRange(1, h.length + 1, 1, falta.length).setValues([falta]).setFontWeight('bold');\n  return s;\n}\nfunction ler_(nome) {\n  const s = aba_(nome);\n  if (s.getLastRow() < 1) return [];\n  const v = s.getDataRange().getValues(), h = (v.shift() || []).map(x => String(x).trim());\n  const t = x => x instanceof Date ? Utilities.formatDate(x, FUSO, 'dd/MM/yyyy HH:mm') : x;\n  const out = [];\n  v.forEach((r, i) => {\n    if (r.join('') === '') return;\n    const o = {};\n    h.forEach((k, j) => { if (k) o[k] = t(r[j]); });\n    o._linha = i + 2;\n    out.push(o);\n  });\n  return out;\n}\nfunction gravar_(s, r, o) {                            // grava pelo nome da coluna; o que não veio fica como estava\n  const h = cab_(s);\n  const atual = r <= s.getLastRow() ? s.getRange(r, 1, 1, h.length).getValues()[0] : [];\n  s.getRange(r, 1, 1, h.length).setValues([h.map((k, i) => {\n    if (!(k in o)) return atual[i] == null ? '' : atual[i];\n    const v = k in JSONS ? JSON.stringify(o[k]) : (o[k] == null ? '' : o[k]);\n    return seguro_(v);\n  })]);\n}\nfunction comTrava_(fn) {                               // uma gravação por vez\n  const lock = LockService.getScriptLock();\n  if (!lock.tryLock(15000)) throw new Error('Outra pessoa está salvando agora. Tente de novo em alguns segundos.');\n  try { return fn(); } finally { lock.releaseLock(); }\n}\nfunction props_() { return PropertiesService.getScriptProperties(); }\n\n// =====================================================================================\n// Tipos de usuário e pessoas\n// =====================================================================================\nfunction perfis_() {\n  const out = [];\n  ler_('Perfis').forEach(p => {\n    const nome = String(p.perfil || '').trim().toLowerCase();\n    if (!nome || out.some(x => x.perfil === nome)) return;\n    const o = { perfil: nome, nome: nomePerfil_(nome), descricao: String(p.descricao || ''), fixo: FIXOS.indexOf(nome) >= 0,\n      gerencia: sim_(p.gerencia), tecnico: sim_(p.tecnico) };\n    PERMS.forEach(k => { o[k] = sim_(p[k]); });\n    if (nome === 'admin') o.gerencia = true;\n    if (nome === 'dev') { o.gerencia = true; o.tecnico = true; PERMS.forEach(k => { o[k] = true; }); }\n    if (nome === 'usuario') { o.gerencia = false; o.tecnico = false; }\n    out.push(o);\n  });\n  return out;\n}\nfunction mapaPerfis_(lista) { const m = {}; (lista || perfis_()).forEach(p => { m[p.perfil] = p; }); return m; }\n\nfunction extrasDe_(x) {                                // \"Matriz:admin; 003:usuario\" → lista\n  return String(x.acessos || '').split(/[;,\\n]/).map(t => t.trim()).filter(Boolean).map(t => {\n    const i = t.indexOf(':');\n    return i < 0 ? null : { agencia: ag_(t.slice(0, i)), perfil: t.slice(i + 1).trim().toLowerCase() };\n  }).filter(Boolean);\n}\nfunction acessosDe_(x) {\n  const lista = [{ agencia: ag_(x.agencia), perfil: String(x.perfil || '').trim().toLowerCase(), principal: true }]\n    .concat(extrasDe_(x));\n  const vistos = {};\n  return lista.filter(a => (vistos[chave_(a)] ? false : (vistos[chave_(a)] = true)));\n}\nfunction formataExtras_(l) { return l.map(a => a.agencia + ':' + a.perfil).join('; '); }\n\nfunction monta_(a, pm) {\n  const p = pm[a.perfil];\n  const perm = {};\n  PERMS.forEach(k => { perm[k] = !!p[k]; });\n  return { agencia: a.agencia, perfil: a.perfil, perm: perm, gerencia: !!p.gerencia, tecnico: !!p.tecnico,\n    ve: a.agencia === 'Matriz' ? AGENCIAS.slice() : [a.agencia] };\n}\nfunction podeVerComo_(real, v, pm) {\n  return !!(real.gerencia && v && pm[v.perfil] && AGENCIAS.indexOf(v.agencia) >= 0 && real.ve.indexOf(v.agencia) >= 0 &&\n    (!pm[v.perfil].tecnico || real.tecnico));\n}\n\n// a pessoa conectada, com o acesso efetivo (o escolhido em Trocar de acesso, ou o do Ver como)\nfunction eu_() {\n  const email = norm_(Session.getActiveUser().getEmail());\n  if (!email) throw new Error('Não deu para identificar seu e-mail. Entre com a conta Google da empresa.');\n  const pm = mapaPerfis_();\n  const x = ler_('Usuarios').find(p => norm_(p.email) === email);\n  if (!x || nao_(x.ativo)) throw new Error('Acesso não liberado: o e-mail ' + email + ' não está cadastrado ou está desativado neste sistema. Peça a um administrador da sua agência para liberar.');\n  const acessos = acessosDe_(x).filter(a => AGENCIAS.indexOf(a.agencia) >= 0 && pm[a.perfil]);\n  if (!acessos.length) throw new Error('Acesso não liberado: a agência ou o tipo de usuário de ' + email + ' está errado na aba Usuarios. Peça a um administrador para corrigir.');\n  const p = props_();\n  const escolhido = acessos.find(a => chave_(a) === p.getProperty('acesso:' + email)) || acessos[0];\n  const real = monta_(escolhido, pm);\n  let ef = real, verComo = null;\n  const vc = p.getProperty('vercomo:' + email);\n  if (vc) {\n    try {\n      const v = JSON.parse(vc);\n      if (podeVerComo_(real, v, pm)) { verComo = { agencia: v.agencia, perfil: v.perfil }; ef = monta_(verComo, pm); }\n    } catch (e) { /* ignora */ }\n  }\n  return { email: email, nome: String(x.nome || email), agencia: ef.agencia, perfil: ef.perfil, perm: ef.perm,\n    admin: ef.gerencia, tecnico: ef.tecnico, ve: ef.ve, acessos: acessos, acesso: escolhido,\n    podeVerComo: real.gerencia, verComo: verComo, real: real, pm: pm };\n}\nfunction euGrava_() {\n  const u = eu_();\n  if (u.verComo) throw new Error('Você está no modo Ver como (' + labelAcesso_(u.verComo) + '). Saia dele para salvar.');\n  return u;\n}\n\n// =====================================================================================\n// Regras das operações (sempre conferidas aqui no servidor)\n// =====================================================================================\nconst atende_ = (u, o) => u.ve.indexOf(o.agencia) >= 0;\nfunction ve_(u, o) {\n  if (o.excluida) return false;\n  if (!u.verComo && o.email === u.email) return true;  // quem cadastrou sempre vê a sua\n  if (!atende_(u, o)) return false;\n  if (o.status === ST.RASCUNHO) return u.perm.solicita || u.admin;\n  return true;\n}\nconst podeEditar_ = (u, o) => PREPARO.indexOf(o.status) >= 0 && u.perm.solicita && atende_(u, o);\nconst podeAnalisar_ = (u, o) => o.status === ST.ANALISE && u.perm.analisa && atende_(u, o);\nconst podeVotar_ = (u, o) => o.status === ST.GERENTE && u.perm.vota && atende_(u, o);\nconst podeDecidir_ = (u, o) => NA_DIRETORIA.indexOf(o.status) >= 0 && u.perm.aprova && atende_(u, o);\nconst podeLiberar_ = (u, o) => o.status === ST.APROVADA && u.perm.libera && atende_(u, o);\nconst podeCancelar_ = (u, o) => CANCELAVEIS.indexOf(o.status) >= 0 && (u.perm.solicita || u.admin) && atende_(u, o);\nconst podeReativar_ = (u, o) => o.status === ST.CANCELADA && (u.perm.solicita || u.admin) && atende_(u, o);\nconst nuncaEnviada_ = o => !o.historico.some(h => h.etapa >= 1);\nconst podeExcluir_ = (u, o) => o.status === ST.RASCUNHO && nuncaEnviada_(o) && (u.perm.solicita || u.admin) && atende_(u, o);\n\nfunction opObj_(x) {                                   // linha da planilha → operação\n  const o = Object.assign({}, x);\n  for (const k in JSONS) {\n    try { o[k] = o[k] ? JSON.parse(o[k]) : clone_(JSONS[k]); } catch (e) { o[k] = clone_(JSONS[k]); }\n  }\n  o.n = +o.n; o.rev = +o.rev || 0; o.valor = num_(o.valor); o.prazo = parseInt(o.prazo, 10) || 0;\n  o.email = norm_(o.email);\n  o.agencia = ag_(o.agencia);\n  o.excluida = sim_(o.excluida);\n  if (STATUS.indexOf(o.status) < 0) o.status = ST.RASCUNHO;\n  return o;\n}\nfunction hist_(o, u, acao, obs, etapa) {\n  o.historico.push({ em: agora_(), por: u.nome, email: u.email, acao: acao, obs: obs || '', etapa: etapa });\n}\n\n// abre a operação dentro da trava, confere se ninguém mexeu, aplica fn e grava\nfunction mexer_(n, rev, fn) {\n  return comTrava_(() => {\n    const s = aba_('Operacoes');\n    const x = ler_('Operacoes').find(r => +r.n === +n);\n    if (!x) throw new Error('Operação não encontrada. Clique em Atualizar.');\n    const o = opObj_(x);\n    if (rev != null && rev !== '' && +rev !== o.rev) throw new Error('Esta operação foi alterada por outra pessoa enquanto você mexia nela. Clique em Atualizar e confira.');\n    const era = o.status;\n    fn(o);\n    o.atualizado = agora_(); o.rev++;\n    if (o.status !== era && !(era === ST.DIRETORIA && o.status === ST.POSTERIOR)) o.chegada = chegada_();\n    delete o._linha;\n    gravar_(s, x._linha, o);\n    return o.n;\n  });\n}\nfunction resposta_(n) { const r = getData(); r.ultimo = n || null; return r; }\n\n// limpa e confere o que veio do formulário do atendente\nfunction limpaOperacao_(d, u) {\n  const dd = d.dados && typeof d.dados === 'object' ? d.dados : {};\n  const ck = d.checklist && typeof d.checklist === 'object' ? d.checklist : {};\n  const simNao = v => v === 'sim' || v === 'não' ? v : '';\n  const checklist = {};\n  CHECK_SOLICITACAO.forEach(c => { checklist[c.id] = ck[c.id] === true; });\n  const x = {\n    agencia: ag_(d.agencia || u.agencia),\n    cooperado: txt_(d.cooperado, 150, 'Nome do cooperado'),\n    conta: txt_(d.conta, 30, 'Conta corrente'),\n    numero_operacao: txt_(d.numero_operacao, 40, 'Número da operação'),\n    modalidade: MODALIDADES.indexOf(d.modalidade) >= 0 ? d.modalidade : '',\n    valor: num_(d.valor),\n    prazo: Math.max(0, Math.min(600, parseInt(digitos_(d.prazo), 10) || 0)),\n    checklist: checklist,\n    dados: {\n      finalidade: txt_(dd.finalidade, 1000, 'Finalidade'),\n      observacao: txt_(dd.observacao, 2000, 'Observações'),\n      tem_avalista: simNao(dd.tem_avalista),\n      tem_garantia: simNao(dd.tem_garantia)\n    }\n  };\n  if (x.valor < 0) throw new Error('O valor não pode ser negativo.');\n  if (!x.cooperado) throw new Error('Preencha pelo menos o nome do cooperado para salvar.');\n  if (u.ve.indexOf(x.agencia) < 0) throw new Error('Você não pode cadastrar operação para a agência ' + x.agencia + '.');\n  return x;\n}\n// o que falta para enviar para análise (a tela confere igual, aqui é a palavra final)\nfunction faltaEnvio_(o) {\n  const f = [];\n  if (!o.numero_operacao) f.push('número da operação na mesa de negócios');\n  if (!o.cooperado) f.push('nome do cooperado');\n  if (!o.conta) f.push('conta do cooperado');\n  if (!o.modalidade) f.push('modalidade');\n  if (!(o.valor > 0)) f.push('valor');\n  if (!(o.prazo > 0)) f.push('prazo');\n  if (!o.dados.finalidade) f.push('finalidade');\n  CHECK_SOLICITACAO.forEach(c => { if (c.obrig && !o.checklist[c.id]) f.push('checklist: ' + c.nome); });\n  if (!o.dados.tem_avalista) f.push('se possui avalista');\n  if (!o.dados.tem_garantia) f.push('se possui garantia');\n  return f;\n}\n\n// =====================================================================================\n// Funções chamadas pela tela: operações\n// =====================================================================================\n\n// cria (sem n) ou corrige (com n). Com d.enviar = true, já manda para a análise.\nfunction salvarOperacao(d) {\n  const u = euGrava_();\n  if (!u.perm.solicita) throw new Error('Seu tipo de usuário não cadastra operações.');\n  d = d || {};\n  const x = limpaOperacao_(d, u);\n  if (d.enviar) {\n    const falta = faltaEnvio_(x);\n    if (falta.length) throw new Error('Para enviar para análise, falta: ' + falta.join(', ') + '.');\n  }\n  let n;\n  if (d.n) {\n    n = mexer_(d.n, d.rev, o => {\n      if (!podeEditar_(u, o)) throw new Error(PREPARO.indexOf(o.status) < 0 ? 'Esta operação já foi enviada (está \"' + o.status + '\") e não pode mais ser alterada.' : 'Você não pode alterar operações desta agência.');\n      const era = o.status;\n      Object.assign(o, x);\n      hist_(o, u, 'corrigiu', '', 0);\n      if (d.enviar) { o.status = ST.ANALISE; hist_(o, u, era === ST.PENDENTE ? 'reenviou para análise' : 'enviou para análise', '', 1); }\n    });\n  } else {\n    n = comTrava_(() => {\n      const s = aba_('Operacoes');\n      const ns = ler_('Operacoes').map(r => +r.n || 0);\n      const o = Object.assign({ n: Math.max.apply(null, [0].concat(ns)) + 1, status: ST.RASCUNHO, criado: agora_(),\n        atualizado: agora_(), chegada: chegada_(), email: u.email, solicitante: u.nome, analise: {}, gerente: {}, diretoria: {},\n        liberacao: {}, historico: [], excluida: '', rev: 1 }, x);\n      hist_(o, u, 'criou', '', 0);\n      if (d.enviar) { o.status = ST.ANALISE; hist_(o, u, 'enviou para análise', '', 1); }\n      gravar_(s, s.getLastRow() + 1, o);\n      return o.n;\n    });\n  }\n  return resposta_(n);\n}\n\n// manda para a análise uma operação já salva\nfunction enviarAnalise(n, rev) {\n  const u = euGrava_();\n  mexer_(n, rev, o => {\n    if (!podeEditar_(u, o)) throw new Error(PREPARO.indexOf(o.status) < 0 ? 'Esta operação já foi enviada.' : 'Você não pode enviar operações desta agência.');\n    const falta = faltaEnvio_(o);\n    if (falta.length) throw new Error('Para enviar para análise, falta: ' + falta.join(', ') + '.');\n    const era = o.status;\n    o.status = ST.ANALISE;\n    hist_(o, u, era === ST.PENDENTE ? 'reenviou para análise' : 'enviou para análise', '', 1);\n  });\n  return resposta_(n);\n}\n\n// analista: d = { acao: 'concluir' | 'pendencia', itens: {capacidade: 'ok'|'nok', ...}, risco, recomendacao, parecer }\nfunction analisarOperacao(n, d, rev) {\n  const u = euGrava_();\n  d = d || {};\n  const parecer = txt_(d.parecer, 4000, 'Parecer');\n  mexer_(n, rev, o => {\n    if (!podeAnalisar_(u, o)) throw new Error(o.status !== ST.ANALISE ? 'Esta operação não está aguardando análise (está \"' + o.status + '\").' : 'Você não analisa operações desta agência.');\n    if (d.acao === 'pendencia') {\n      o.status = ST.PENDENTE;\n      o.analise = Object.assign({}, o.analise, { pendencia: { texto: parecer, por: u.nome, em: agora_() } });\n      hist_(o, u, 'devolveu ao atendente', parecer, 1);\n      return;\n    }\n    if (d.acao !== 'concluir') throw new Error('Ação inválida.');\n    const itens = {}, sem = [];\n    CHECK_ANALISE.forEach(c => {\n      const v = d.itens && d.itens[c.id];\n      if (v !== 'ok' && v !== 'nok') sem.push(c.nome); else itens[c.id] = v;\n    });\n    if (sem.length) throw new Error('Marque no checklist da análise: ' + sem.join(', ') + '.');\n    if (RECOMENDACOES.indexOf(d.recomendacao) < 0) throw new Error('Escolha a recomendação da análise.');\n    o.status = ST.GERENTE;\n    o.analise = { itens: itens, risco: RISCOS.indexOf(d.risco) >= 0 ? d.risco : '', recomendacao: d.recomendacao,\n      parecer: parecer, por: u.nome, email: u.email, em: agora_() };\n    hist_(o, u, 'concluiu a análise', d.recomendacao, 2);\n  });\n  return resposta_(n);\n}\n\n// gerente: d = { acao: 'enviar' | 'devolver', iap, parecer }. Ao enviar, o voto do gerente é favorável.\nfunction votarGerente(n, d, rev) {\n  const u = euGrava_();\n  d = d || {};\n  const parecer = txt_(d.parecer, 4000, 'Parecer do gerente');\n  mexer_(n, rev, o => {\n    if (!podeVotar_(u, o)) throw new Error(o.status !== ST.GERENTE ? 'Esta operação não está com o gerente (está \"' + o.status + '\").' : 'Você não vota em operações desta agência.');\n    if (d.acao === 'devolver') {\n      o.status = ST.ANALISE;\n      hist_(o, u, 'devolveu para a análise', parecer, 2);\n      return;\n    }\n    if (d.acao !== 'enviar') throw new Error('Ação inválida.');\n    const iapTxt = String(d.iap == null ? '' : d.iap).trim();\n    if (!iapTxt || !/^-?[\\d.,]+$/.test(iapTxt)) throw new Error('Informe o IAP (só números).');\n    o.status = ST.DIRETORIA;\n    o.gerente = { iap: num_(iapTxt), voto: 'Favorável', parecer: parecer, por: u.nome, email: u.email, em: agora_() };\n    hist_(o, u, 'votou favorável e enviou à diretoria', parecer, 3);\n  });\n  return resposta_(n);\n}\n\n// diretoria: acao = 'aprovar' | 'reprovar' (negar) | 'devolver' | 'estender' (aprovação posterior)\n// O motivo só é obrigatório para negar.\nfunction decidirDiretoria(n, acao, texto, rev) {\n  const u = euGrava_();\n  texto = txt_(texto, 4000, 'Parecer da diretoria');\n  const st = { aprovar: ST.APROVADA, reprovar: ST.NEGADA, devolver: ST.GERENTE, estender: ST.POSTERIOR }[acao];\n  if (!st) throw new Error('Ação inválida.');\n  if (acao === 'reprovar' && !texto) throw new Error('Escreva o motivo para negar.');\n  mexer_(n, rev, o => {\n    if (!podeDecidir_(u, o)) throw new Error(NA_DIRETORIA.indexOf(o.status) < 0 ? 'Esta operação não está aguardando a diretoria (está \"' + o.status + '\").' : 'Você não aprova operações desta agência.');\n    if (acao === 'estender' && o.status === ST.POSTERIOR && o.diretoria && o.diretoria.adiadaDia === hojeISO_()) throw new Error('Esta operação já ficou para aprovação posterior hoje.');\n    if (acao === 'devolver') { o.diretoria = {}; hist_(o, u, 'devolveu ao gerente', texto, 3); }\n    else if (acao === 'estender') {\n      o.diretoria = { adiadaDia: hojeISO_(), adiadaEm: agora_(), por: u.nome, texto: texto };\n      hist_(o, u, 'deixou para aprovação posterior', texto, 3);\n    } else {\n      o.diretoria = { decisao: st, texto: texto, por: u.nome, email: u.email, em: agora_() };\n      hist_(o, u, acao === 'aprovar' ? 'aprovou' : 'negou', texto, acao === 'aprovar' ? 4 : 3);\n    }\n    o.status = st;\n  });\n  return resposta_(n);\n}\n\n// atendente da agência: d = { data: 'dd/mm/aaaa', contrato, obs }\nfunction liberarOperacao(n, d, rev) {\n  const u = euGrava_();\n  d = d || {};\n  const data = String(d.data || '').trim();\n  if (!dataOk_(data)) throw new Error('Informe a data da liberação no formato dd/mm/aaaa.');\n  const contrato = txt_(d.contrato, 40, 'Número do contrato');\n  const obs = txt_(d.obs, 1000, 'Observação');\n  mexer_(n, rev, o => {\n    if (!podeLiberar_(u, o)) throw new Error(o.status !== ST.APROVADA ? 'Só operação aprovada pode ser liberada (esta está \"' + o.status + '\").' : 'Você não libera operações desta agência.');\n    o.status = ST.LIBERADA;\n    o.liberacao = { data: data, contrato: contrato, obs: obs, por: u.nome, email: u.email, em: agora_() };\n    hist_(o, u, 'liberou', obs, 5);\n  });\n  return resposta_(n);\n}\n\n// cancelar = true desiste; false reativa (volta a Rascunho)\nfunction cancelarOperacao(n, cancelar, motivo, rev) {\n  const u = euGrava_();\n  motivo = txt_(motivo, 500, 'Motivo');\n  mexer_(n, rev, o => {\n    if (cancelar) {\n      if (!podeCancelar_(u, o)) throw new Error(o.status === ST.CANCELADA ? 'Já está cancelada.' : 'Esta operação não pode ser cancelada (está \"' + o.status + '\").');\n      if (!motivo) throw new Error('Escreva o motivo do cancelamento.');\n      o.status = ST.CANCELADA;\n      hist_(o, u, 'cancelou', motivo, 0);\n    } else {\n      if (!podeReativar_(u, o)) throw new Error('Só operação cancelada pode ser reativada.');\n      o.status = ST.RASCUNHO;\n      hist_(o, u, 'reativou', motivo, 0);\n    }\n  });\n  return resposta_(n);\n}\n\n// rascunho que nunca foi enviado: some da lista (dá para desfazer)\nfunction excluirOperacao(n, rev) {\n  const u = euGrava_();\n  mexer_(n, rev, o => {\n    if (!podeExcluir_(u, o)) throw new Error('Só dá para excluir rascunho que nunca foi enviado para análise.');\n    o.excluida = 'sim';\n    hist_(o, u, 'excluiu', '', 0);\n  });\n  return resposta_(n);\n}\nfunction restaurarOperacao(n) {\n  const u = euGrava_();\n  mexer_(n, null, o => {\n    if (!o.excluida || o.status !== ST.RASCUNHO || !(u.perm.solicita || u.admin) || !atende_(u, o)) throw new Error('Esta operação não pode ser restaurada.');\n    o.excluida = '';\n    hist_(o, u, 'restaurou', '', 0);\n  });\n  return resposta_(n);\n}\n\n// =====================================================================================\n// Carga da tela\n// =====================================================================================\nfunction getData() {\n  const u = eu_();\n  const pm = u.pm;\n  const ops = ler_('Operacoes').map(opObj_).filter(o => ve_(u, o)).map(o => {\n    delete o._linha;\n    return Object.assign(o, {\n      meu: o.email === u.email,\n      editar: podeEditar_(u, o), analisar: podeAnalisar_(u, o), votar: podeVotar_(u, o), decidir: podeDecidir_(u, o),\n      liberar: podeLiberar_(u, o), cancelar: podeCancelar_(u, o), reativar: podeReativar_(u, o), excluir: podeExcluir_(u, o)\n    });\n  }).sort((a, b) => b.n - a.n);\n\n  let pessoas = [];\n  if (u.admin) {\n    pessoas = ler_('Usuarios').filter(p => p.email && u.ve.indexOf(ag_(p.agencia)) >= 0).map(p => ({\n      email: norm_(p.email), nome: String(p.nome || ''), agencia: ag_(p.agencia), perfil: String(p.perfil || '').trim().toLowerCase(),\n      ativo: !nao_(p.ativo), acessos: extrasDe_(p), eu: norm_(p.email) === u.email\n    })).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));\n  }\n  const atalhos = ler_('Atalhos').map(a => ({ nome: String(a.nome || '').trim(), link: https_(a.link), descricao: String(a.descricao || '').trim() }))\n    .filter(a => a.nome && a.link);\n  const perfis = perfis_();\n  return {\n    sistema: NOME_SISTEMA,\n    versao: { numero: VERSAO, data: VERSAO_DATA },\n    hoje: hojeISO_(),\n    eu: {\n      email: u.email, nome: u.nome, agencia: u.agencia, perfil: u.perfil, perm: u.perm, admin: u.admin, tecnico: u.tecnico,\n      ve: u.ve, matriz: u.agencia === 'Matriz',\n      acesso: { agencia: u.acesso.agencia, perfil: u.acesso.perfil, chave: chave_(u.acesso), label: labelAcesso_(u.acesso) },\n      acessos: u.acessos.map(a => ({ agencia: a.agencia, perfil: a.perfil, cha     box.innerHTML = '<style>body{padding-bottom:56px}#demoBox{position:fixed;left:12px;bottom:12px;z-index:85;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);padding:6px 8px;border-radius:14px;background:#f4c21b;color:#16211a;font:600 12.5px Inter,system-ui,sans-serif;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}#demoBox select{height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.2);background:#fff;color:#16211a;font:inherit;max-width:190px}#demoBox button{height:30px;border:0;border-radius:8px;background:rgba(0,0,0,.15);color:#16211a;font:inherit;padding:0 8px;cursor:pointer}</style>' +
      '<span>TESTE &middot; entrar como</span><select id="demoQuem"></select><button type="button" id="demoZerar" title="Apagar tudo e voltar aos dados de exemplo">Recomeçar</button>';
    document.body.appendChild(box);
    const sel = box.querySelector('select');
    const lista = PESSOAS.slice();
    try { (estado.abas.Usuarios.d || []).slice(1).forEach(l => { if (l[0] && !lista.some(p => p[0] === l[0])) lista.push([l[0], l[1] || l[0]]); }); } catch (e) {}
    sel.innerHTML = lista.map(p => '<option value="' + p[0] + '"' + (p[0] === QUEM ? ' selected' : '') + '>' + p[1] + '</option>').join('');
    sel.onchange = () => { try { localStorage.setItem(CHAVE + ':quem', sel.value); } catch (e) {} location.reload(); };
    box.querySelector('#demoZerar').onclick = () => { try { localStorage.removeItem(CHAVE); } catch (e) {} location.reload(); };
  });
})();
</script>
<script>
const VERSAO_TELA = 3;

/* =================== estado =================== */
let DB = null, CARREGOU_EM = 0, OCUPADO = false;
let ABA = '';
let RESUMO = {};       /* decisões da diretoria nesta rodada da fila */
const UI = { filtro: '', busca: '', ag: '', vistaU: 'pessoas', buscaP: '', agP: '', menu: '' };
let F = null;          /* formulário da operação em edição */
let FALTA = [];        /* campos marcados em vermelho no formulário */
let PAINEL = null;     /* { tipo: 'op' | 'pessoa' | 'tipo', ... } */
let A = {};            /* respostas do bloco de ação do painel (análise, voto, decisão, liberação) */
let LINKS = null;      /* cópia em edição dos links */

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PT = '\u00b7', RET = '\u2026', NRO = 'N\u00ba';
const REGULAR = { 'floppy-disk': 1, 'copy': 1 };   /* ícones que o Guia pede no estilo fa-regular */
const ic = (n, extra) => '<i class="' + (REGULAR[n] ? 'fa-regular' : 'fa-solid') + ' fa-' + n + (extra ? ' ' + extra : '') + '"></i>';
const brl = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dig = s => String(s == null ? '' : s).replace(/\D/g, '');
const iniciais = n => String(n || '?').trim().split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase() || '?';
const labelAg = a => a === 'Matriz' ? 'Matriz' : 'Agência ' + a;
const nomePerfil = p => { const x = DB && DB.perfis.find(t => t.perfil === p); return x ? x.nome : p; };
function hoje() { const d = new Date(), p = n => (n < 10 ? '0' : '') + n; return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear(); }

window.__ctx = () => ({
  versaoTela: VERSAO_TELA,
  versao: DB ? DB.versao.numero : '',
  email: DB ? DB.eu.email : '',
  acesso: DB ? (DB.eu.acesso.label + (DB.eu.verComo ? ' (vendo como ' + DB.eu.verComo.label + ')' : '')) : ''
});

/* =================== servidor =================== */
function run(fn, ...args) {
  return new Promise((ok, erro) => {
    const r = google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e => erro(new Error((e && e.message) ? e.message : String(e))));
    r[fn].apply(r, args);
  });
}
function girar(sim) { const b = $('#btnAtualizar'); if (b) b.classList.toggle('gira', !!sim); }

async function carregar() {
  girar(true);
  if (!DB) estado('carregando');
  const lento = setTimeout(() => { if (!DB) estado('lento'); }, 20000);
  try {
    aplicar(await run('getData'));
  } catch (e) {
    if (!DB) {
      if (/^Acesso não liberado/.test(e.message)) estado('bloqueado', e.message.replace(/^Acesso não liberado:\s*/, ''));
      else estado('erro', e.message);
    } else popErro(e.message);
  } finally { clearTimeout(lento); girar(false); }
}

/* chama o servidor numa ação de gravar; a resposta é o getData() novo */
async function acao(fn, args, depois) {
  if (OCUPADO) return;
  OCUPADO = true; girar(true);
  $$('[data-trava]').forEach(b => { b.disabled = true; });
  try {
    const r = await run(fn, ...args);
    aplicar(r);
    if (depois) depois(r);
  } catch (e) {
    popErro(e.message);
  } finally {
    OCUPADO = false; girar(false);
    $$('[data-trava]').forEach(b => { b.disabled = false; });
  }
}

function aplicar(r) {
  DB = r; CARREGOU_EM = Date.now();
  if (!F) F = formVazio();
  const abas = abasVisiveis();
  if (!abas.find(a => a.id === ABA)) ABA = 'ops';
  render();
}

/* =================== estados da tela =================== */
function estado(tipo, msg) {
  $('#tabsbar').hidden = true;
  const m = $('#main');
  if (tipo === 'carregando') m.innerHTML = '<div class="estado"><div class="bol"><div class="anel"></div></div><h2>Carregando' + RET + '</h2><p>Buscando seus dados na planilha.</p></div>';
  if (tipo === 'lento') m.innerHTML = '<div class="estado"><div class="bol"><div class="anel"></div></div><h2>A planilha não respondeu' + RET + '</h2><p>Se você está logado em mais de uma conta Google, abra numa janela anônima só com a conta da empresa.</p></div>';
  if (tipo === 'bloqueado') m.innerHTML = '<div class="estado"><div class="bol" style="color:var(--warn)">' + ic('lock') + '</div><h2>Acesso não liberado</h2><p>' + esc(msg) + '</p></div>';
  if (tipo === 'erro') m.innerHTML = '<div class="estado"><div class="bol" style="color:var(--danger)">' + ic('plug') + '</div><h2>Não deu para carregar.</h2><p>Motivo: ' + esc(msg) + '</p><p><button class="btn btn-primary" data-a="atualizar">' + ic('rotate-right') + ' Tentar de novo</button></p></div>';
}

/* =================== desenho geral =================== */
function render() {
  renderTopo(); renderAbas(); renderVC(); renderRodape();
  renderConteudo();
  if (PAINEL) renderPainel();
}
function renderConteudo() {
  const m = $('#main');
  if (ABA === 'nova') m.innerHTML = telaForm();
  else if (ABA === 'ops') m.innerHTML = telaOps();
  else if (ABA === 'usuarios') m.innerHTML = telaUsuarios();
  else if (ABA === 'gerenciar') m.innerHTML = telaGerenciar();
  if (ABA === 'nova') atualizaContadores();
}

function renderTopo() {
  const e = DB.eu;
  $('#logo').innerHTML = DB.linkLogo
    ? '<a class="logo" href="' + esc(DB.linkLogo) + '" target="_top" title="CrediBrás"><svg><use href="#mark"/></svg><span>CrediBrás</span></a>'
    : '<span class="logo"><svg><use href="#mark"/></svg><span>CrediBrás</span></span>';
  const tem = DB.atalhos.length > 0;
  let s = '<button type="button" class="sis" ' + (tem ? 'data-a="menu" data-m="links" aria-haspopup="true" aria-expanded="' + (UI.menu === 'links') + '"' : 'disabled') + '>' + esc(DB.sistema) + (tem ? ' <span class="chev">' + ic('chevron-down') + '</span>' : '') + '</button>';
  if (UI.menu === 'links') {
    s += '<div class="menu esq" role="menu"><div class="cap">Links e guias</div>' + DB.atalhos.map(a =>
      '<a class="mi" href="' + esc(a.link) + '" target="_blank" rel="noopener"><span class="ic">' + ic('book-open') + '</span><span class="tx"><b>' + esc(a.nome) + '</b>' + (a.descricao ? '<small>' + esc(a.descricao) + '</small>' : '') + '</span>' + ic('up-right-from-square', 'muted') + '</a>').join('') + '</div>';
  }
  $('#sisWrap').innerHTML = s;
  const pa = $('#pillAg'); pa.hidden = false; pa.textContent = e.agencia === 'Matriz' ? 'Matriz' : 'Agência ' + e.agencia;
  const dv = $('#devBtns');
  dv.hidden = !DB.central;
  dv.innerHTML = DB.central ? '<a class="devbtn" href="' + esc(DB.central.planilha) + '" target="_blank" rel="noopener">' + ic('table') + ' Planilha</a><a class="devbtn" href="' + esc(DB.central.codigo) + '" target="_blank" rel="noopener">' + ic('code') + ' Código</a>' : '';
  let u = '<button type="button" class="userbtn" data-a="menu" data-m="user" aria-haspopup="true" aria-expanded="' + (UI.menu === 'user') + '"><span class="av"></span><span class="nm"></span><span class="chev">' + ic('chevron-down') + '</span></button>';
  if (UI.menu === 'user') {
    u += '<div class="menu dir" role="menu"><div class="grp"><div class="me"><span class="av"></span><div style="min-width:0"><b class="nmx"></b><div class="em"></div><div class="ac">' + esc(e.acesso.label) + '</div></div></div></div>';
    if (e.acessos.length > 1) {
      u += '<div class="grp"><div class="cap">Trocar de acesso</div>' + e.acessos.map(a => {
        const on = a.chave === e.acesso.chave;
        return '<button type="button" class="mi' + (on ? ' on' : '') + '" data-a="trocar" data-k="' + esc(a.chave) + '"><span class="ic">' + ic(a.agencia === 'Matriz' ? 'building-columns' : 'key') + '</span><span class="tx"><b>' + esc(a.label) + '</b></span>' + (on ? '<span class="ok">' + ic('check') + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    }
    if (e.podeVerComo && e.verComoOpcoes) {
      const o = e.verComoOpcoes;
      u += '<div class="grp"><div class="cap">' + ic('eye') + ' Ver como (para testar)</div><div class="vcform">' +
        '<select class="in" id="vcAg" aria-label="Agência">' + o.agencias.map(a => '<option value="' + esc(a) + '">' + esc(labelAg(a)) + '</option>').join('') + '</select>' +
        '<select class="in" id="vcPf" aria-label="Tipo">' + o.perfis.map(p => '<option value="' + esc(p.perfil) + '">' + esc(p.nome) + '</option>').join('') + '</select>' +
        '<button type="button" class="btn btn-primary" style="width:100%" data-a="verComo">' + ic('eye') + ' Ver como</button></div></div>';
    }
    u += '</div>';
  }
  const uw = $('#userWrap'); uw.innerHTML = u;
  $$('.av', uw).forEach(x => { x.textContent = iniciais(e.nome); });
  $('.nm', uw).textContent = e.nome.split(' ')[0];
  if ($('.nmx', uw)) { $('.nmx', uw).textContent = e.nome; $('.em', uw).textContent = e.email; }
}

function abasVisiveis() {
  const e = DB.eu, l = [];
  if (e.perm.solicita) l.push({ id: 'nova', nome: F && F.n ? 'Corrigir operação' : 'Nova operação', icone: F && F.n ? 'pen' : 'circle-plus' });
  l.push({ id: 'ops', nome: 'Operações', icone: 'list-check', cont: tarefas().length });
  if (e.admin) l.push({ id: 'usuarios', nome: 'Usuários', icone: 'user-group' });
  if (e.admin && e.matriz) l.push({ id: 'gerenciar', nome: 'Links', icone: 'book-open' });
  return l;
}
function renderAbas() {
  $('#tabsbar').hidden = false;
  $('#nav').innerHTML = abasVisiveis().map(a => '<button type="button" role="tab" data-a="aba" data-id="' + a.id + '" aria-selected="' + (a.id === ABA) + '">' + ic(a.icone) + ' ' + esc(a.nome) + (a.cont ? ' <span class="cnt">' + a.cont + '</span>' : '') + '</button>').join('');
}
function renderVC() {
  const v = DB.eu.verComo, b = $('#vcbar');
  b.hidden = !v;
  b.innerHTML = v ? '<div class="wrap"><span>' + ic('eye') + '</span><span class="tx">Você está vendo <b>' + esc(v.label) + '</b>. Só para conferir: nada é salvo.</span><button type="button" class="btn btn-sm btn-outline pillbtn" data-a="sairVC">' + ic('arrow-left') + ' Voltar ao meu acesso</button></div>' : '';
}
function renderRodape() {
  const f = $('#rodape'), v = DB.versao;
  if (+v.numero !== VERSAO_TELA) {
    f.className = 'alerta';
    f.textContent = 'Atenção: a tela está na versão ' + VERSAO_TELA + ' e o servidor na ' + v.numero + '. Um dos arquivos não foi atualizado.';
  } else {
    const p = String(v.data).split(' ');
    f.className = '';
    f.textContent = DB.sistema + ' ' + PT + ' Versão ' + v.numero + ' ' + PT + ' Publicada em ' + p[0] + (p[1] ? ' às ' + p[1] : '');
  }
}

/* =================== operações: regras de exibição =================== */
const ETAPAS = [
  { nome: 'Solicitação', sub: 'Atendente' },
  { nome: 'Análise', sub: 'Analista' },
  { nome: 'Gerente', sub: 'IAP e voto' },
  { nome: 'Diretoria', sub: 'Aprovação' },
  { nome: 'Liberação', sub: 'Atendente' }
];
const ETAPA_DO_STATUS = { 'Rascunho': 0, 'Pendente': 0, 'Em análise': 1, 'Com o gerente': 2, 'Na diretoria': 3, 'Aprovação posterior': 3, 'Aprovada': 4, 'Liberada': 5, 'Negada': 3, 'Cancelada': -1 };
const COR = { 'Rascunho': '', 'Pendente': 'wait', 'Em análise': 'info', 'Com o gerente': 'info', 'Na diretoria': 'info', 'Aprovação posterior': 'wait', 'Aprovada': 'ok', 'Liberada': 'ok', 'Negada': 'no', 'Cancelada': '' };
const tag = st => '<span class="tag ' + (COR[st] || '') + '">' + esc(st) + '</span>';
function proximo(o) {
  return ({
    'Rascunho': 'Atendente envia para análise', 'Pendente': 'Atendente corrige a pendência',
    'Em análise': 'Aguardando a análise', 'Com o gerente': 'Aguardando o IAP do gerente',
    'Na diretoria': 'Aguardando a diretoria', 'Aprovação posterior': 'Diretoria decide depois', 'Aprovada': 'Aguardando a liberação',
    'Liberada': 'Liberada em ' + ((o.liberacao && o.liberacao.data) || ''), 'Negada': 'Encerrada', 'Cancelada': 'Encerrada'
  })[o.status] || '';
}
/* ficou para aprovação posterior HOJE: sai da fila de hoje e volta amanhã */
const adiadaHoje = o => o.status === 'Aprovação posterior' && !!o.diretoria && o.diretoria.adiadaDia === DB.hoje;
const ehTarefa = o => (o.editar && (o.status === 'Pendente' || o.meu)) || o.analisar || o.votar || (o.decidir && !adiadaHoje(o)) || o.liberar;
const tarefas = () => DB.operacoes.filter(ehTarefa);
const EM_CURSO = ['Em análise', 'Com o gerente', 'Na diretoria', 'Aprovação posterior'];
/* listas de cada tipo de usuário: cada um vê só o que é do seu trabalho */
const VISOES = [
  { id: 'corrigir', perm: 'solicita', nome: 'Rascunhos e pendências', f: o => o.editar, fila: true },
  { id: 'enviadas', perm: 'solicita', nome: 'Enviadas', f: o => EM_CURSO.indexOf(o.status) >= 0 },
  { id: 'liberar', perm: 'libera', nome: 'Para liberar', f: o => o.liberar, fila: true },
  { id: 'liberadas', perm: 'libera', nome: 'Liberadas', f: o => o.status === 'Liberada' },
  { id: 'encerradas', perm: 'solicita', nome: 'Negadas e canceladas', f: o => o.status === 'Negada' || o.status === 'Cancelada' },
  { id: 'analisar', perm: 'analisa', nome: 'Para analisar', f: o => o.analisar, fila: true },
  { id: 'analisadas', perm: 'analisa', nome: 'Analisadas', f: o => !!(o.analise && o.analise.recomendacao) && o.status !== 'Em análise' },
  { id: 'gerente', perm: 'vota', nome: 'Para enviar à diretoria', f: o => o.votar, fila: true },
  { id: 'enviadasDir', perm: 'vota', nome: 'Enviadas à diretoria', f: o => !!(o.gerente && o.gerente.voto) && o.status !== 'Com o gerente' },
  { id: 'aprovar', perm: 'aprova', nome: 'Pendentes de aprovação', f: o => o.decidir, fila: true },
  { id: 'aprovadas', perm: 'aprova', nome: 'Aprovadas', f: o => o.status === 'Aprovada' || o.status === 'Liberada' },
  { id: 'negadas', perm: 'aprova', nome: 'Negadas', f: o => o.status === 'Negada' },
  { id: 'todas', perm: 'gerencia', nome: 'Todas', f: () => true }
];
function visoes() {
  const e = DB.eu;
  const l = VISOES.filter(v => v.perm === 'gerencia' ? e.admin : e.perm[v.perm]);
  return l.length ? l : [VISOES[VISOES.length - 1]];
}
function visaoAtual() {
  const l = visoes();
  let v = l.find(x => x.id === UI.filtro);
  if (!v) { v = l.find(x => x.fila && DB.operacoes.some(x.f)) || l[0]; UI.filtro = v.id; }
  return v;
}

/* lista da tela, na ordem mostrada. Listas de trabalho: por ordem de chegada (a mais antiga primeiro).
   Pendentes de aprovação: grupo 'hoje' (a fila) e grupo 'depois' (aprovação posterior marcada hoje) */
function listaVisivel(grupo) {
  const v = visaoAtual();
  const q = UI.busca.trim().toLowerCase();
  let l = DB.operacoes.filter(o => !UI.ag || o.agencia === UI.ag).filter(v.f).filter(o => !q || String(o.cooperado).toLowerCase().indexOf(q) >= 0 ||
    String(o.numero_operacao).toLowerCase().indexOf(q) >= 0 || String(o.conta).toLowerCase().indexOf(q) >= 0 || String(o.n) === q);
  if (v.id === 'aprovar') l = l.filter(o => grupo === 'depois' ? adiadaHoje(o) : !adiadaHoje(o));
  return v.fila ? l.sort(porChegada) : l;
}
const porChegada = (a, b) => String(a.chegada || '').localeCompare(String(b.chegada || '')) || a.n - b.n;
function quando(c) {
  const m = String(c || '').match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  return m ? m[3] + '/' + m[2] + ' ' + m[4] + ':' + m[5] : '';
}
function itemOp(o, grupo) {
  let prox = proximo(o);
  if (o.status === 'Aprovação posterior' && o.diretoria && o.diretoria.adiadaEm && !adiadaHoje(o)) prox = 'Deixada para depois em ' + o.diretoria.adiadaEm.slice(0, 5);
  else if (ehTarefa(o) && o.chegada) prox += ' ' + PT + ' desde ' + quando(o.chegada);
  return '<button type="button" class="item' + (ehTarefa(o) ? ' tarefa' : '') + '" data-a="abrirOp" data-n="' + o.n + '" data-g="' + (grupo || '') + '">' +
    '<span class="nro num"><small>' + NRO + '</small>' + o.n + '</span>' +
    '<span class="mid"><b>' + esc(o.cooperado) + '</b><span class="sub">' + esc([o.conta ? 'Conta ' + o.conta : '', o.modalidade, labelAg(o.agencia), o.numero_operacao ? 'Mesa ' + o.numero_operacao : ''].filter(Boolean).join(' ' + PT + ' ')) + '</span></span>' +
    '<span class="dir"><span class="val num">' + brl(o.valor) + (o.prazo ? ' <span class="muted small">em ' + o.prazo + 'x</span>' : '') + '</span>' + tag(o.status) +
    '<span class="prox">' + esc(prox) + '</span></span></button>';
}

function telaOps() {
  const e = DB.eu, v = visaoAtual(), lv = visoes();
  const base = DB.operacoes.filter(o => !UI.ag || o.agencia === UI.ag);
  const lista = listaVisivel(), depois = v.id === 'aprovar' ? listaVisivel('depois') : [];
  let h = '<div class="stack"><div class="row" style="justify-content:space-between"><h2 class="tit">Operações de crédito</h2>' +
    (e.perm.solicita ? '<button class="btn btn-primary" data-a="novaOp">' + ic('plus') + ' Nova operação</button>' : '') + '</div>';
  if (lv.length > 1) h += '<div class="toolbar">' + lv.map(x => {
    const n = x.id === 'aprovar' ? base.filter(o => x.f(o) && !adiadaHoje(o)).length : base.filter(x.f).length;
    return '<button type="button" class="chip" data-a="filtro" data-id="' + x.id + '" aria-pressed="' + (x.id === v.id) + '">' + esc(x.nome) + (x.fila && n ? ' <span class="cnt">' + n + '</span>' : '') + '</button>';
  }).join('') + '</div>';
  h += '<div class="toolbar"><div class="busca">' + ic('magnifying-glass') + '<input class="in" id="buscaOps" placeholder="Buscar por cooperado, conta, número da operação' + RET + '" value="' + esc(UI.busca) + '"></div>';
  if (e.ve.length > 1) h += '<select class="in" id="agOps" style="width:auto" aria-label="Agência"><option value="">Todas as agências</option>' + e.ve.map(a => '<option value="' + a + '"' + (UI.ag === a ? ' selected' : '') + '>' + esc(labelAg(a)) + '</option>').join('') + '</select>';
  h += '</div>';
  if (v.fila && lista.length > 1) h += '<div class="muted small">' + ic('list-check') + ' Por ordem de chegada. Abra a primeira e vá decidindo: a próxima abre sozinha.</div>';
  if (!lista.length) {
    h += '<div class="vazio">' + (v.fila && !UI.busca.trim() ? ic('circle-check') + (v.id === 'aprovar' ? ' Nenhuma operação pendente de aprovação hoje.' : ' Nada esperando por você agora. Tudo em dia!') : 'Nenhuma operação encontrada.') + '</div>';
  } else h += '<div class="lista">' + lista.map(o => itemOp(o, 'hoje')).join('') + '</div>';
  if (depois.length) {
    h += '<h3 style="margin-top:8px">' + ic('stopwatch') + ' Aprovação posterior <span class="muted small" style="font-weight:500">' + PT + ' deixadas para decidir depois. Amanhã voltam para a fila.</span></h3>' +
      '<div class="lista">' + depois.map(o => itemOp(o, 'depois')).join('') + '</div>';
  }
  return h + '</div>';
}

/* =================== formulário da operação =================== */
function formVazio() {
  return { n: null, rev: null, status: '', agencia: DB ? DB.eu.agencia : '', cooperado: '', conta: '', numero_operacao: '', modalidade: '', valor: '', prazo: '',
    checklist: {}, dados: { finalidade: '', observacao: '', tem_avalista: '', tem_garantia: '' } };
}
function formDe(o) {
  const v = n => n ? (+n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
  const d = o.dados || {};
  return { n: o.n, rev: o.rev, status: o.status, agencia: o.agencia, cooperado: o.cooperado || '', conta: o.conta || '',
    numero_operacao: o.numero_operacao || '', modalidade: o.modalidade || '', valor: v(o.valor), prazo: o.prazo ? String(o.prazo) : '',
    checklist: Object.assign({}, o.checklist), ultimaObs: ultimaDevolucao(o),
    dados: { finalidade: d.finalidade || '', observacao: d.observacao || '', tem_avalista: d.tem_avalista || '', tem_garantia: d.tem_garantia || '' } };
}
function ultimaDevolucao(o) {
  const h = (o.historico || []).slice().reverse().find(x => /^devolveu/.test(x.acao));
  return h && o.status === 'Pendente' ? h : null;
}
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split('.'); const u = ks.pop(); ks.reduce((a, k) => a[k], o)[u] = v; }

function campo(rot, path, opt) {
  opt = opt || {};
  const v = getPath(F, path);
  const err = FALTA.indexOf(path) >= 0;
  let inp;
  if (opt.tipo === 'select') inp = '<select class="in' + (v ? ' cheio' : '') + '" data-f="' + path + '" id="f_' + path + '"><option value="">Escolha' + RET + '</option>' + opt.lista.map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>';
  else if (opt.tipo === 'area') inp = '<textarea class="in' + (v ? ' cheio' : '') + '" data-f="' + path + '" id="f_' + path + '" maxlength="' + (opt.max || 2000) + '" placeholder="' + esc(opt.ph || '') + '">' + esc(v) + '</textarea>';
  else inp = '<input class="in' + (v ? ' cheio' : '') + '" data-f="' + path + '" id="f_' + path + '" value="' + esc(v) + '"' + (opt.mask ? ' data-mask="' + opt.mask + '" inputmode="' + (opt.mask === 'int' || opt.mask === 'data' ? 'numeric' : 'decimal') + '"' : '') + (opt.check ? ' data-check="' + opt.check + '"' : '') + ' maxlength="' + (opt.max || 150) + '" placeholder="' + esc(opt.ph || '') + '" autocomplete="off">';
  return '<div class="campo' + (opt.full ? ' full' : '') + (err ? ' erro' : '') + '" data-campo="' + path + '"><label for="f_' + path + '">' + esc(rot) + (opt.ob ? ' <span class="ob">*</span>' : '') + '</label>' + inp +
    (err ? '<span class="msgerro">' + ic('circle-xmark') + ' ' + esc(opt.msg || 'Preencha este campo.') + '</span>' : '') + '</div>';
}
function simNao(path) {
  const v = getPath(F, path), err = FALTA.indexOf(path) >= 0;
  return '<div class="row" data-campo="' + path + '">' + ['sim', 'não'].map(x => '<button type="button" class="chip" data-a="fset" data-p="' + path + '" data-v="' + x + '" aria-pressed="' + (v === x) + '">' + (x === 'sim' ? 'Sim' : 'Não') + '</button>').join('') +
    (err ? '<span class="msgerro">' + ic('circle-xmark') + ' Responda sim ou não.</span>' : '') + '</div>';
}
function secao(id, titulo, corpo) {
  return '<section class="secao" data-sec="' + id + '"><div class="hd"><span class="bola"></span><h3>' + titulo + '</h3><span class="contador" data-cont="' + id + '"></span></div><div class="bx">' + corpo + '</div></section>';
}
function passos(atual, falhou) {
  return '<div class="passos" aria-label="Etapas da operação">' + ETAPAS.map((e, i) => {
    const cl = i < atual ? 'feito' : i === atual ? 'atual' : '';
    return '<div class="passo ' + cl + '"><span class="c">' + (i < atual ? ic('check') : i + 1) + '</span><b>' + e.nome + '</b><small>' + e.sub + '</small></div>';
  }).join('') + '</div>';
}
