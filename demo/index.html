/* o que falta para enviar (igual ao servidor) */
function faltaForm() {
  const f = [], nomes = [];
  const add = (p, n) => { f.push(p); nomes.push(n); };
  if (!F.cooperado.trim()) add('cooperado', 'nome do cooperado');
  if (!F.conta.trim()) add('conta', 'número da conta');
  if (!F.numero_operacao.trim()) add('numero_operacao', 'número da operação na mesa de negócios');
  if (!F.modalidade) add('modalidade', 'modalidade');
  if (!(numBR(F.valor) > 0)) add('valor', 'valor');
  if (!(+F.prazo > 0)) add('prazo', 'prazo');
  if (!F.dados.finalidade.trim()) add('dados.finalidade', 'finalidade');
  DB.listas.checkSolicitacao.forEach(c => { if (c.obrig && !F.checklist[c.id]) add('checklist.' + c.id, c.nome); });
  if (!F.dados.tem_avalista) add('dados.tem_avalista', 'se possui avalista');
  if (!F.dados.tem_garantia) add('dados.tem_garantia', 'se possui garantia');
  return { campos: f, nomes: nomes };
}
const SECOES = {
  coop: () => [F.cooperado.trim(), F.conta.trim()],
  op: () => [F.numero_operacao.trim(), F.modalidade, numBR(F.valor) > 0, +F.prazo > 0, F.dados.finalidade.trim()],
  check: () => DB.listas.checkSolicitacao.filter(c => c.obrig).map(c => F.checklist[c.id]),
  aval: () => [F.dados.tem_avalista, F.dados.tem_garantia]
};
function atualizaContadores() {
  let tot = 0, ok = 0;
  Object.keys(SECOES).forEach(k => {
    const l = SECOES[k](), n = l.filter(Boolean).length;
    tot += l.length; ok += n;
    const c = $('[data-cont="' + k + '"]');
    if (c) { c.textContent = n + '/' + l.length; c.classList.toggle('ok', n === l.length); }
  });
  const b = $('#barraF'); if (b) b.style.width = Math.round(ok / tot * 100) + '%';
}
function dadosForm(enviar) {
  return { n: F.n, rev: F.rev, enviar: !!enviar, agencia: F.agencia, cooperado: F.cooperado, conta: F.conta,
    numero_operacao: F.numero_operacao, modalidade: F.modalidade, valor: F.valor, prazo: F.prazo, checklist: F.checklist,
    dados: { finalidade: F.dados.finalidade, observacao: F.dados.observacao, tem_avalista: F.dados.tem_avalista, tem_garantia: F.dados.tem_garantia } };
}

/* =================== máscaras e validação =================== */
function dataOk(v) {
  const m = String(v || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return false;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getFullYear() === +m[3] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[1];
}
const numBR = v => { const t = String(v || '').replace(/\./g, '').replace(',', '.'); return isFinite(+t) ? +t : 0; };
const MASK = {
  money: v => { const d = dig(v).replace(/^0+/, '').slice(0, 13); if (!d) return ''; const n = (+d / 100); return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
  int: v => dig(v).slice(0, 3),
  dec: v => { let t = String(v).replace(/[^\d,]/g, ''); const i = t.indexOf(','); if (i >= 0) t = t.slice(0, i + 1) + t.slice(i + 1).replace(/,/g, '').slice(0, 2); return t.slice(0, 10); },
  data: v => { const d = dig(v).slice(0, 8); return d.replace(/(\d{2})(\d)/, '$1/$2').replace(/(\d{2})\/(\d{2})(\d)/, '$1/$2/$3'); }
};
const CHECKS = {
  data: { ok: v => !v || dataOk(v), msg: 'Data inválida. Use dd/mm/aaaa.' }
};
/* validação ao sair do campo */
function check(el) {
  const k = el.getAttribute('data-check'); if (!k) return true;
  const c = el.closest('.campo'); const okv = CHECKS[k].ok(el.value);
  if (c) {
    c.classList.toggle('erro', !okv);
    const m = $('.msgerro', c); if (m) m.remove();
    if (!okv) c.insertAdjacentHTML('beforeend', '<span class="msgerro">' + ic('circle-xmark') + ' ' + esc(CHECKS[k].msg) + '</span>');
  }
  return okv;
}

/* =================== painel lateral =================== */
function abrirPainel(p, semAnimar) { PAINEL = p; A = {}; renderPainel(!semAnimar); }
function fecharPainel() { PAINEL = null; A = {}; $('#painelRaiz').innerHTML = ''; }
function renderPainel(novo) {
  let corpo = '';
  if (PAINEL.tipo === 'op') {
    const o = DB.operacoes.find(x => x.n === PAINEL.n);
    if (!o) { fecharPainel(); return; }
    corpo = painelOp(o);
  } else if (PAINEL.tipo === 'pessoa') corpo = painelPessoa();
  else if (PAINEL.tipo === 'tipo') corpo = painelTipo();
  const scroll = $('#painelRaiz .pb') ? $('#painelRaiz .pb').scrollTop : 0;
  $('#painelRaiz').className = novo ? 'novo' : '';
  $('#painelRaiz').innerHTML = '<div class="fundo" data-a="fecharPainel"></div><aside class="painel' + (PAINEL.tipo === 'op' ? ' centro' : '') + '" role="dialog" aria-modal="true">' + corpo + '</aside>';
  const pb = $('#painelRaiz .pb'); if (pb) pb.scrollTop = novo ? 0 : scroll;
}
const cab = (nro, titulo, tags) => '<div class="ph"><button type="button" class="ibtn x" data-a="fecharPainel" aria-label="Fechar" title="Fechar">' + ic('xmark') + '</button>' +
  (nro ? '<div class="nro">' + nro + '</div>' : '') + '<h2>' + titulo + '</h2><div class="row" style="gap:6px">' + (tags || '') + '</div></div>';
const dl = itens => '<dl class="dl">' + itens.filter(Boolean).map(x => '<div' + (x[2] ? ' class="full"' : '') + '><dt>' + esc(x[0]) + '</dt><dd>' + (x[3] ? x[1] : esc(x[1] === '' || x[1] == null ? '\u2013' : x[1])) + '</dd></div>').join('') + '</dl>';

function linhaTempo(o) {
  const atual = ETAPA_DO_STATUS[o.status];
  const env = (o.historico || []).filter(h => /enviou para an/.test(h.acao)).slice(-1)[0];
  const info = [
    env ? 'Enviada por ' + env.por + ' em ' + env.em : 'Cadastrada por ' + (o.solicitante || '') + ' em ' + o.criado,
    o.analise && o.analise.recomendacao ? o.analise.recomendacao + ' ' + PT + ' ' + o.analise.por + ' em ' + o.analise.em : '',
    o.gerente && o.gerente.voto ? 'Voto ' + o.gerente.voto.toLowerCase() + ' ' + PT + ' IAP ' + String(o.gerente.iap).replace('.', ',') + ' ' + PT + ' ' + o.gerente.por : '',
    o.diretoria && o.diretoria.decisao ? o.diretoria.decisao + ' por ' + o.diretoria.por + ' em ' + o.diretoria.em : '',
    o.liberacao && o.liberacao.data ? 'Liberada em ' + o.liberacao.data + ' por ' + o.liberacao.por : ''
  ];
  const ult = (o.historico || []).slice(-1)[0];
  let nota = '', notaNo = false;
  if (ult && /^devolveu/.test(ult.acao)) { nota = 'Devolvida por ' + ult.por + ' (' + ult.em + ')' + (ult.obs ? ': ' + ult.obs : ''); notaNo = true; }
  else if (o.status === 'Aprovação posterior' && o.diretoria && o.diretoria.adiadaEm) nota = 'A diretoria vai decidir depois (' + o.diretoria.por + ', ' + o.diretoria.adiadaEm + ')' + (o.diretoria.texto ? ': ' + o.diretoria.texto : '');
  else nota = proximo(o);
  if (o.status === 'Negada') { nota = 'Negada: ' + ((o.diretoria && o.diretoria.texto) || ''); notaNo = true; }
  let parou = -1;
  if (o.status === 'Cancelada') {
    const c = (o.historico || []).filter(h => h.acao === 'cancelou').slice(-1)[0];
    parou = Math.max(0, info.filter(Boolean).length - 1);
    nota = 'Cancelada' + (c ? ' por ' + c.por + ' em ' + c.em + ': ' + c.obs : '');
    notaNo = true;
  }
  return '<div class="tl">' + ETAPAS.map((e, i) => {
    let cl = '', bol = i + 1;
    if (o.status === 'Cancelada') { cl = i < parou ? 'feito' : i === parou ? 'parou' : ''; bol = i < parou ? ic('check') : i === parou ? ic('xmark') : i + 1; }
    else if (o.status === 'Negada' && i === 3) { cl = 'falhou'; bol = ic('xmark'); }
    else if (i < atual) { cl = 'feito'; bol = ic('check'); }
    else if (i === atual) cl = 'atual';
    const eAtual = (o.status === 'Cancelada' && i === parou) || (o.status !== 'Cancelada' && (i === atual || (o.status === 'Negada' && i === 3)));
    return '<div class="et ' + cl + '"><span class="b">' + bol + '</span><div class="t"><b>' + e.nome + '</b><small>' + esc(info[i] || e.sub) + '</small>' +
      (eAtual && nota ? '<div class="nota' + (notaNo ? ' no' : '') + '">' + esc(nota) + '</div>' : '') + '</div></div>';
  }).join('') + '</div>';
}

function painelOp(o) {
  const L = DB.listas, d = o.dados || {}, ac = blocoAcao(o);
  let h = cab(NRO + ' ' + o.n + (o.numero_operacao ? ' ' + PT + ' Mesa ' + esc(o.numero_operacao) : ''), esc(o.cooperado),
    tag(o.status) + '<span class="tag plain">' + esc(labelAg(o.agencia)) + '</span><span class="tag plain">' + brl(o.valor) + (o.prazo ? ' em ' + o.prazo + 'x' : '') + '</span>');
  const sn = v => v === 'sim' ? '<span class="tag ok">Sim</span>' : v === 'não' ? '<span class="tag plain">Não</span>' : '\u2013';
  let dir = '<div class="bloco"><span class="cap">Cooperado e operação</span>' + dl([
    ['Cooperado', o.cooperado], ['Conta', o.conta], ['Número na mesa de negócios', o.numero_operacao], ['Modalidade', o.modalidade],
    ['Valor', brl(o.valor)], ['Prazo', o.prazo ? o.prazo + ' meses' : ''], ['Agência', labelAg(o.agencia)], ['Atendente', o.solicitante],
    ['Finalidade', d.finalidade, true], d.observacao ? ['Observações', d.observacao, true] : null]) + '</div>';
  dir += '<div class="bloco"><span class="cap">Checklist da solicitação</span>' + L.checkSolicitacao.map(c =>
    '<div class="ck">' + (o.checklist && o.checklist[c.id] ? '<span class="s">' + ic('circle-check') + '</span>' : '<span class="z">' + ic('circle-xmark') + '</span>') + esc(c.nome) + '</div>').join('') +
    '<div class="sn" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span>Avalista ' + sn(d.tem_avalista) + '</span><span>Garantia ' + sn(d.tem_garantia) + '</span></div></div>';
  if (o.analise && o.analise.recomendacao) {
    const an = o.analise;
    dir += '<div class="bloco"><span class="cap">Análise</span>' + L.checkAnalise.map(c => {
      const v = an.itens && an.itens[c.id];
      return '<div class="ck">' + (v === 'ok' ? '<span class="s">' + ic('circle-check') + '</span>' : '<span class="n">' + ic('circle-xmark') + '</span>') + esc(c.nome) + ' ' + (v === 'ok' ? '<span class="tag ok">Ok</span>' : '<span class="tag no">Não ok</span>') + '</div>';
    }).join('') +
      '<div class="row" style="margin-top:8px">' + '<span class="tag ' + (an.recomendacao === 'Desfavorável' ? 'no' : an.recomendacao === 'Favorável' ? 'ok' : 'wait') + '">' + esc(an.recomendacao) + '</span>' + (an.risco ? '<span class="tag plain">Risco ' + esc(an.risco) + '</span>' : '') + '</div>' +
      (an.parecer ? '<div class="texto">' + esc(an.parecer) + '</div>' : '') + '<div class="por">' + esc(an.por) + ' ' + PT + ' ' + esc(an.em) + '</div></div>';
  }
  if (o.gerente && o.gerente.voto) {
    const g = o.gerente;
    dir += '<div class="bloco"><span class="cap">Gerente</span><div class="row"><span class="tag plain">IAP ' + esc(String(g.iap).replace('.', ',')) + '</span><span class="tag ok">Voto favorável</span></div>' +
      (g.parecer ? '<div class="texto">' + esc(g.parecer) + '</div>' : '') + '<div class="por">' + esc(g.por) + ' ' + PT + ' ' + esc(g.em) + '</div></div>';
  }
  if (o.diretoria && o.diretoria.decisao) {
    const x = o.diretoria;
    dir += '<div class="bloco"><span class="cap">Diretoria</span>' + tag(x.decisao) + (x.texto ? '<div class="texto">' + esc(x.texto) + '</div>' : '') + '<div class="por">' + esc(x.por) + ' ' + PT + ' ' + esc(x.em) + '</div></div>';
  }
  if (o.liberacao && o.liberacao.data) {
    const x = o.liberacao;
    dir += '<div class="bloco"><span class="cap">Liberação</span>' + dl([['Data da liberação', x.data], ['Contrato', x.contrato], x.obs ? ['Observação', x.obs, true] : null]) + '<div class="por">' + esc(x.por) + ' ' + PT + ' ' + esc(x.em) + '</div></div>';
  }
  dir += ac.html;
  const esq = '<div class="bloco"><span class="cap">Etapas</span>' + linhaTempo(o) + '</div>' +
    '<div class="bloco"><span class="cap">Histórico</span><div class="hist">' + (o.historico || []).slice().reverse().map(x =>
      '<div class="h"><span class="q">' + esc(x.em) + '</span><span><b>' + esc(x.por) + '</b> ' + esc(x.acao) + (x.obs ? '<div class="obs">' + esc(x.obs) + '</div>' : '') + '</span></div>').join('') + '</div></div>';
  h += '<div class="pb"><div class="opgrid"><div class="col">' + dir + '</div><div class="col">' + esq + '</div></div></div>';

  const bts = ac.bts.slice();
  if (!ac.bts.length) {
    if (o.excluir) bts.push('<button type="button" class="btn btn-ghost" data-a="excluirOp" data-n="' + o.n + '" data-trava>' + ic('trash') + ' Excluir</button>');
    if (o.cancelar) bts.push('<button type="button" class="btn btn-ghost" data-a="cancelarOp" data-n="' + o.n + '">' + ic('xmark') + ' Cancelar operação</button>');
    if (o.reativar) bts.push('<button type="button" class="btn btn-outline" data-a="reativarOp" data-n="' + o.n + '" data-trava>' + ic('rotate-right') + ' Reativar</button>');
    if (o.editar) {
      bts.push('<button type="button" class="btn btn-outline" data-a="corrigirOp" data-n="' + o.n + '">' + ic('pen') + ' Corrigir</button>');
      bts.push('<button type="button" class="btn btn-primary" data-a="enviarOp" data-n="' + o.n + '" data-trava>' + ic('paper-plane') + ' Enviar para análise</button>');
    }
  }
  const fila = PAINEL.fila || [o.n], i = fila.indexOf(o.n);
  const nav = fila.length > 1 ? '<div class="fila"><button type="button" class="btn btn-ghost btn-sm" data-a="navOp" data-d="-1"' + (i > 0 ? '' : ' disabled') + '>' + ic('arrow-left') + ' Anterior</button>' +
    '<span class="pos">' + (i + 1) + ' de ' + fila.length + '</span>' +
    '<button type="button" class="btn btn-ghost btn-sm" data-a="navOp" data-d="1"' + (i < fila.length - 1 ? '' : ' disabled') + '>Próxima ' + ic('arrow-right') + '</button></div>' : '<span></span>';
  h += '<div class="pf op">' + nav + '<div class="bts-acao">' + bts.join('') + '</div></div>';
  return h;
}

/* depois de decidir, abre a próxima tarefa da fila (ordem de chegada) sem fechar a janela */
function avancar(nAtual, msg) {
  const fila = (PAINEL && PAINEL.fila) || [];
  const i = fila.indexOf(nAtual);
  const ordem = fila.slice(i + 1).concat(fila.slice(0, Math.max(i, 0)));
  const prox = ordem.find(n => { const x = DB.operacoes.find(o => o.n === n); return x && ehTarefa(x); });
  if (prox) { abrirPainel({ tipo: 'op', n: prox, fila: fila }); toast(msg + ' ' + PT + ' abrindo a próxima'); return true; }
  fecharPainel();
  return false;
}

  raiz._botoes = o.botoes || [{}];
  if (t === 'ok') {
    const pop = $('.pop', raiz), cs = ['#7cc242', '#f4c21b', '#0d6532', '#3b6cf0', '#d64545'];
    for (let i = 0; i < 26; i++) {
      const c = document.createElement('span'); c.className = 'confete';
      c.style.left = (35 + Math.random() * 30) + '%'; c.style.background = cs[i % cs.length];
      c.style.setProperty('--dx', ((Math.random() - .5) * 320) + 'px'); c.style.animationDelay = (.4 + Math.random() * .3) + 's';
      pop.appendChild(c);
    }
  }
  setTimeout(() => { const b = $('.bts .btn', raiz); if (b) b.focus(); }, 50);
}
function closePopup() { $('#popRaiz').innerHTML = ''; }
function popErro(msg) {
  const vc = DB && DB.eu.verComo;
  popup({ tipo: 'erro', titulo: /modo Ver como/.test(msg) ? 'Você está no modo Ver como' : 'Não deu certo', texto: msg,
    botoes: vc ? [{ txt: 'Voltar ao meu acesso', cls: 'btn-primary', fn: () => acao('sairVerComo', []) }, { txt: 'Fechar' }] : [{ txt: 'Entendi', cls: 'btn-primary' }] });
}
let toastTimer = null;
function toast(txt, acaoT) {
  const r = $('#toastRaiz');
  clearTimeout(toastTimer);
  r.innerHTML = '<div class="toast" role="status"><span></span>' + (acaoT ? '<button type="button" data-a="toastAcao">' + esc(acaoT.txt) + '</button>' : '') + '</div>';
  $('span', r).textContent = txt;
  r._fn = acaoT && acaoT.fn;
  toastTimer = setTimeout(() => { r.innerHTML = ''; }, 3500);
}
/* excluir com segundo clique */
function segundoClique(btn) {
  if (btn.classList.contains('confirmar')) return true;
  const antes = btn.innerHTML;
  btn.classList.add('confirmar');
  btn.innerHTML = ic('trash') + ' Confirmar exclusão';
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('confirmar'); btn.innerHTML = antes; } }, 4000);
  return false;
}

/* =================== ações (cliques) =================== */
const opDe = el => DB.operacoes.find(o => o.n === +el.getAttribute('data-n'));
/* terminou uma operação: segue para a próxima da fila; se acabou, mostra o popup */
function fimDaFila(o, titulo, texto, extra, diretoria) {
  if (avancar(o.n, NRO + ' ' + o.n + ': ' + titulo.toLowerCase())) return;
  if (diretoria) {
    const nomes = [['aprovar', 'Aprovadas'], ['reprovar', 'Negadas'], ['estender', 'Para aprovação posterior'], ['devolver', 'Devolvidas ao gerente']];
    const det = nomes.filter(x => RESUMO[x[0]]).map(x => [x[1], String(RESUMO[x[0]])]);
    const depois = DB.operacoes.filter(adiadaHoje).length;
    popup({ tipo: 'ok', titulo: 'Acabaram as aprovações de hoje', texto: 'Todas as operações pendentes de hoje foram decididas.' +
      (depois ? ' ' + depois + (depois > 1 ? ' ficaram' : ' ficou') + ' para aprovação posterior e ' + (depois > 1 ? 'voltam' : 'volta') + ' para a fila amanhã.' : ''), detalhes: det });
    RESUMO = {};
    return;
  }
  popup({ tipo: /negada/i.test(titulo) ? 'warn' : 'ok', titulo: titulo, texto: (texto ? texto + ' ' : '') + 'Não há mais operações na sua fila.',
    detalhes: [['Operação', NRO + ' ' + o.n], ['Cooperado', o.cooperado], ['Valor', brl(o.valor)]].concat(extra || []) });
}
const ACOES = {
  atualizar: () => { LINKS = null; carregar(); },
  tema: () => {
    const novo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', novo);
    try { localStorage.setItem('tema', novo); } catch (e) { /* sem armazenamento */ }
  },
  menu: el => { const m = el.getAttribute('data-m'); UI.menu = UI.menu === m ? '' : m; renderTopo(); },
  trocar: el => { UI.menu = ''; acao('trocarAcesso', [el.getAttribute('data-k')], r => toast('Agora você está em ' + r.eu.acesso.label)); },
  verComo: () => { const a = $('#vcAg').value, p = $('#vcPf').value; UI.menu = ''; acao('verComo', [a, p]); },
  sairVC: () => acao('sairVerComo', []),
  aba: el => { ABA = el.getAttribute('data-id'); UI.menu = ''; renderAbas(); renderConteudo(); window.scrollTo(0, 0); },
  filtro: el => { UI.filtro = el.getAttribute('data-id'); renderConteudo(); },
  novaOp: () => { F = formVazio(); FALTA = []; ABA = 'nova'; renderAbas(); renderConteudo(); },
  abrirOp: el => { RESUMO = {}; abrirPainel({ tipo: 'op', n: +el.getAttribute('data-n'), fila: listaVisivel(el.getAttribute('data-g') || 'hoje').map(o => o.n) }); },
  navOp: el => { const f = PAINEL.fila, i = f.indexOf(PAINEL.n) + +el.getAttribute('data-d'); if (f[i] != null) abrirPainel({ tipo: 'op', n: f[i], fila: f }, true); },
  fecharPainel: () => fecharPainel(),

  /* formulário */
  fset: el => { setPath(F, el.getAttribute('data-p'), el.getAttribute('data-v')); limpaFalta(el.getAttribute('data-p')); renderConteudo(); },
  descartarForm: () => { F = formVazio(); FALTA = []; renderAbas(); renderConteudo(); toast('Formulário limpo'); },
  salvarForm: () => {
    if (!F.cooperado.trim()) { FALTA = ['cooperado']; renderConteudo(); popup({ tipo: 'warn', titulo: 'Falta o nome do cooperado', texto: 'Preencha pelo menos o nome do cooperado para salvar o rascunho.' }); focaFalta(); return; }
    acao('salvarOperacao', [dadosForm(false)], r => {
      const o = r.operacoes.find(x => x.n === r.ultimo);
      if (o) F = formDe(o);
      FALTA = []; renderAbas(); renderConteudo();
      toast('Rascunho salvo ' + PT + ' ' + NRO + ' ' + r.ultimo);
    });
  },
  enviarForm: () => {
    const f = faltaForm();
    FALTA = f.campos;
    if (f.campos.length) {
      renderConteudo();
      popup({ tipo: 'warn', titulo: 'Falta preencher', texto: 'Para enviar para análise, falta: ' + f.nomes.join(', ') + '.' });
      focaFalta();
      return;
    }
    acao('salvarOperacao', [dadosForm(true)], r => {
      const o = r.operacoes.find(x => x.n === r.ultimo) || {};
      F = formVazio(); FALTA = []; ABA = 'ops'; render();
      popup({ tipo: 'ok', titulo: 'Enviada para análise', texto: 'A operação foi para o analista.', detalhes: [['Operação', NRO + ' ' + r.ultimo], ['Cooperado', o.cooperado || ''], ['Valor', brl(o.valor)], ['Mesa de negócios', o.numero_operacao || '']] });
    });
  },

  /* painel da operação */
  corrigirOp: el => { const o = opDe(el); F = formDe(o); FALTA = []; fecharPainel(); ABA = 'nova'; renderAbas(); renderConteudo(); window.scrollTo(0, 0); },
  enviarOp: el => {
    const o = opDe(el);
    F = formDe(o); const f = faltaForm();
    if (f.campos.length) { FALTA = f.campos; fecharPainel(); ABA = 'nova'; renderAbas(); renderConteudo(); popup({ tipo: 'warn', titulo: 'Falta preencher', texto: 'Para enviar para análise, falta: ' + f.nomes.join(', ') + '.' }); return; }
    F = formVazio();
    acao('enviarAnalise', [o.n, o.rev], () => popup({ tipo: 'ok', titulo: 'Enviada para análise', texto: 'A operação foi para o analista.', detalhes: [['Operação', NRO + ' ' + o.n], ['Cooperado', o.cooperado]] }));
  },
  aset: el => { A[el.getAttribute('data-k')] = el.getAttribute('data-v'); renderPainel(); },
  aitem: el => { A.itens = A.itens || {}; A.itens[el.getAttribute('data-k')] = el.getAttribute('data-v'); renderPainel(); },
  analiseOk: el => {
    const o = opDe(el), falta = DB.listas.checkAnalise.filter(c => !(A.itens && A.itens[c.id])).map(c => c.nome);
    if (!A.recomendacao) falta.push('recomendação');
    if (falta.length) return popup({ tipo: 'warn', titulo: 'Falta preencher', texto: 'Para concluir a análise, falta: ' + falta.join(', ') + '.' });
    const rec = A.recomendacao;
    acao('analisarOperacao', [o.n, { acao: 'concluir', itens: A.itens, risco: A.risco || '', recomendacao: rec, parecer: A.parecer || '' }, o.rev],
      () => fimDaFila(o, 'Análise concluída', 'A operação foi para o gerente incluir o IAP.', [['Recomendação', rec]]));
  },
  analisePend: el => { const o = opDe(el); acao('analisarOperacao', [o.n, { acao: 'pendencia', parecer: A.parecer || '' }, o.rev], () => fimDaFila(o, 'Devolvida ao atendente')); },
  gerEnviar: el => {
    const o = opDe(el);
    if (!String(A.iap || '').trim()) return popup({ tipo: 'warn', titulo: 'Falta o IAP', texto: 'Informe o IAP para enviar à diretoria.' });
    const iap = A.iap;
    acao('votarGerente', [o.n, { acao: 'enviar', iap: iap, parecer: A.parecer || '' }, o.rev],
      () => fimDaFila(o, 'Enviada à diretoria', 'Seu voto favorável foi registrado.', [['IAP', iap]]));
  },
  gerDevolver: el => { const o = opDe(el); acao('votarGerente', [o.n, { acao: 'devolver', parecer: A.parecer || '' }, o.rev], () => fimDaFila(o, 'Devolvida para a análise')); },
  dirDecide: el => {
    const o = opDe(el), v = el.getAttribute('data-v');
    if (v === 'reprovar' && !String(A.texto || '').trim()) { popup({ tipo: 'warn', titulo: 'Escreva o motivo', texto: 'Para negar, escreva o motivo no parecer da diretoria.' }); const t = $('#a_texto'); if (t) t.focus(); return; }
    const t = { aprovar: 'Aprovada', reprovar: 'Negada', devolver: 'Devolvida ao gerente', estender: 'Ficou para aprovação posterior' }[v];
    acao('decidirDiretoria', [o.n, v, A.texto || '', o.rev], () => { RESUMO[v] = (RESUMO[v] || 0) + 1; fimDaFila(o, t, '', null, true); });
  },
  liberarOp: el => {
    const o = opDe(el);
    if (!dataOk(A.data)) return popup({ tipo: 'warn', titulo: 'Data inválida', texto: 'Informe a data da liberação no formato dd/mm/aaaa.' });
    const data = A.data;
    acao('liberarOperacao', [o.n, { data: data, contrato: A.contrato || '', obs: A.obs || '' }, o.rev], () => fimDaFila(o, 'Liberação registrada', 'Operação concluída.', [['Data', data]]));
  },
  cancelarOp: () => { A.cancelando = true; renderPainel(); const t = $('#a_motivo'); if (t) t.focus(); },
  cancelarNao: () => { A.cancelando = false; renderPainel(); },
  cancelarSim: el => {
    const o = opDe(el);
    if (!String(A.motivo || '').trim()) return popup({ tipo: 'warn', titulo: 'Escreva o motivo', texto: 'Escreva o motivo do cancelamento.' });
    acao('cancelarOperacao', [o.n, true, A.motivo, o.rev], () => { A = {}; toast('Operação cancelada', { txt: 'Desfazer', fn: () => { const x = DB.operacoes.find(y => y.n === o.n); acao('cancelarOperacao', [o.n, false, 'desfez o cancelamento', x ? x.rev : null]); } }); });
  },
  reativarOp: el => { const o = opDe(el); acao('cancelarOperacao', [o.n, false, '', o.rev], () => toast('Operação reativada como rascunho')); },
  excluirOp: el => {
    if (!segundoClique(el)) return;
    const o = opDe(el);
    acao('excluirOperacao', [o.n, o.rev], () => { fecharPainel(); toast('Item excluído', { txt: 'Desfazer', fn: () => acao('restaurarOperacao', [o.n]) }); });
  },

  /* pessoas */
  vistaU: el => { UI.vistaU = el.getAttribute('data-id'); renderConteudo(); },
  novaPessoa: () => abrirPainel({ tipo: 'pessoa', orig: '', f: { nome: '', email: '', ativo: true, agencia: DB.eu.agencia, perfil: 'usuario', acessos: [] } }),
  abrirPessoa: el => {
    const p = DB.pessoas.find(x => x.email === el.getAttribute('data-email'));
    abrirPainel({ tipo: 'pessoa', orig: p.email, f: { nome: p.nome, email: p.email, ativo: p.ativo, agencia: p.agencia, perfil: p.perfil, acessos: p.acessos.map(a => Object.assign({}, a)) } });
  },
  pset: el => { PAINEL.f[el.getAttribute('data-k')] = el.getAttribute('data-v'); renderPainel(); },
  paddAc: () => {
    const a = { agencia: $('#p_acAg').value, perfil: $('#p_acPf').value }, P = PAINEL.f;
    if ((a.agencia === P.agencia && a.perfil === P.perfil) || P.acessos.some(x => x.agencia === a.agencia && x.perfil === a.perfil)) return toast('Esta pessoa já tem esse acesso');
    P.acessos.push(a); renderPainel();
  },
  pdelAc: el => { PAINEL.f.acessos.splice(+el.getAttribute('data-i'), 1); renderPainel(); },
  salvarPessoa: () => {
    const P = PAINEL.f;
    if (!P.nome.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(P.email.trim())) return popup({ tipo: 'warn', titulo: 'Falta preencher', texto: 'Preencha o nome e um e-mail válido.' });
    const novo = !PAINEL.orig;
    acao('salvarPessoa', [{ emailOriginal: PAINEL.orig, email: P.email, nome: P.nome, agencia: P.agencia, perfil: P.perfil, ativo: P.ativo, acessos: P.acessos }],
      () => { fecharPainel(); popup({ tipo: 'ok', titulo: novo ? 'Pessoa cadastrada' : 'Pessoa salva', texto: '', detalhes: [['Nome', P.nome], ['E-mail', P.email.trim().toLowerCase()], ['Acesso', labelAg(P.agencia) + ' ' + PT + ' ' + nomePerfil(P.perfil)]] }); });
  },
  excluirPessoa: el => {
    if (!segundoClique(el)) return;
    const p = DB.pessoas.find(x => x.email === PAINEL.orig);
    acao('excluirPessoa', [PAINEL.orig], () => {
      fecharPainel();
      toast('Item excluído', { txt: 'Desfazer', fn: () => acao('salvarPessoa', [{ email: p.email, nome: p.nome, agencia: p.agencia, perfil: p.perfil, ativo: p.ativo, acessos: p.acessos }]) });
    });
  },

  /* tipos */
  novoTipo: () => { const f = { perfil: '', descricao: '', gerencia: false, tecnico: false }; Object.keys(DB.permInfo).forEach(k => { f[k] = false; }); abrirPainel({ tipo: 'tipo', novo: true, f: f }); },
  abrirTipo: el => { const p = DB.perfis.find(x => x.perfil === el.getAttribute('data-p')); abrirPainel({ tipo: 'tipo', novo: false, f: Object.assign({ tecnicoOrig: p.tecnico }, p) }); },
  salvarTipo: () => {
    const T = PAINEL.f, d = { novo: PAINEL.novo, perfil: T.perfil, descricao: T.descricao, gerencia: !!T.gerencia, tecnico: !!T.tecnico };
    Object.keys(DB.permInfo).forEach(k => { d[k] = !!T[k]; });
    if (!String(T.perfil).trim()) return popup({ tipo: 'warn', titulo: 'Falta o nome', texto: 'Dê um nome ao tipo de usuário.' });
    acao('salvarTipo', [d], () => { fecharPainel(); toast('Tipo de usuário salvo'); });
  },
  excluirTipo: el => { if (!segundoClique(el)) return; const p = PAINEL.f.perfil; acao('excluirTipo', [p], () => { fecharPainel(); toast('Tipo excluído'); }); },

  /* links */
  lkAdd: () => { LINKS.atalhos.push({ nome: '', link: '', descricao: '' }); LINKS.mexeu = true; renderConteudo(); },
  lkDel: el => { LINKS.atalhos.splice(+el.getAttribute('data-i'), 1); LINKS.mexeu = true; renderConteudo(); },
  lkMove: el => { const i = +el.getAttribute('data-i'), j = i + +el.getAttribute('data-d'), l = LINKS.atalhos; const x = l[i]; l[i] = l[j]; l[j] = x; LINKS.mexeu = true; renderConteudo(); },
  lkDescartar: () => { LINKS = null; renderConteudo(); toast('Mudanças descartadas'); },
  lkSalvar: () => {
    const L = LINKS;
    const ruim = (L.linkLogo.trim() && !linkOk(L.linkLogo)) || L.atalhos.some(a => !String(a.nome).trim() || !linkOk(a.link));
    if (ruim) { renderConteudo(); return popup({ tipo: 'warn', titulo: 'Confira os campos em vermelho', texto: 'Cada link precisa de nome e de um endereço que comece com https:\u002f\u002f' }); }
    acao('salvarLinks', [{ linkLogo: L.linkLogo.trim(), atalhos: L.atalhos }], () => { LINKS = null; renderConteudo(); popup({ tipo: 'ok', titulo: 'Links salvos', texto: 'Os links já aparecem para todo mundo.' }); });
  },

  /* popup e toast */
  fecharPop: (el, ev) => { if (ev.target === el || el.tagName === 'BUTTON') closePopup(); },
  popBtn: el => { const b = ($('#popRaiz')._botoes || [])[+el.getAttribute('data-i')] || {}; closePopup(); if (b.fn) b.fn(); },
  toastAcao: () => { const r = $('#toastRaiz'); const fn = r._fn; r.innerHTML = ''; if (fn) fn(); }
};
function limpaFalta(p) { const i = FALTA.indexOf(p); if (i >= 0) FALTA.splice(i, 1); }
function focaFalta() { setTimeout(() => { const c = $('.campo.erro .in, .chk.erro input, [data-campo].erro'); if (c) { c.scrollIntoView({ block: 'center', behavior: 'smooth' }); if (c.focus) c.focus({ preventScroll: true }); } }, 60); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (UI.menu && !ev.target.closest('.mwrap')) { UI.menu = ''; renderTopo(); }
  if (!el || el.disabled) return;
  const fn = ACOES[el.getAttribute('data-a')];
  if (fn) fn(el, ev);
});

document.addEventListener('input', ev => {
  const el = ev.target;
  const m = el.getAttribute('data-mask');
  if (m && MASK[m]) { const v = MASK[m](el.value); if (v !== el.value) el.value = v; }
  const c = el.closest('.campo');
  if (c && c.classList.contains('erro') && !el.hasAttribute('data-lk')) { c.classList.remove('erro'); const me = $('.msgerro', c); if (me) me.remove(); }
  if (el.hasAttribute('data-f')) {
    setPath(F, el.getAttribute('data-f'), el.value);
    limpaFalta(el.getAttribute('data-f'));
    el.classList.toggle('cheio', !!el.value);
    atualizaContadores();
  } else if (el.hasAttribute('data-ak')) A[el.getAttribute('data-ak')] = el.value;
  else if (el.hasAttribute('data-pf')) PAINEL.f[el.getAttribute('data-pf')] = el.type === 'checkbox' ? el.checked : el.value;
  else if (el.hasAttribute('data-tf')) PAINEL.f[el.getAttribute('data-tf')] = el.value;
  else if (el.hasAttribute('data-lk')) {
    const k = el.getAttribute('data-lk');
    if (k === 'logo') LINKS.linkLogo = el.value; else LINKS.atalhos[+el.getAttribute('data-i')][k] = el.value;
    LINKS.mexeu = true;
    const b = $('[data-a="lkDescartar"]'); if (b) b.disabled = false;
  } else if (el.id === 'buscaOps') { UI.busca = el.value; refazLista('#buscaOps'); }
  else if (el.id === 'buscaP') { UI.buscaP = el.value; refazLista('#buscaP'); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.hasAttribute('data-fc')) { F.checklist[el.getAttribute('data-fc')] = el.checked; limpaFalta('checklist.' + el.getAttribute('data-fc')); const l = el.closest('.chk'); if (l) l.classList.remove('erro'); atualizaContadores(); }
  else if (el.hasAttribute('data-pf') && el.type === 'checkbox') PAINEL.f[el.getAttribute('data-pf')] = el.checked;
  else if (el.hasAttribute('data-tp')) PAINEL.f[el.getAttribute('data-tp')] = el.checked;
  else if (el.id === 'agOps') { UI.ag = el.value; renderConteudo(); }
  else if (el.id === 'agP') { UI.agP = el.value; renderConteudo(); }
  else if (el.hasAttribute('data-ak') && el.tagName === 'SELECT') A[el.getAttribute('data-ak')] = el.value;
});
document.addEventListener('focusout', ev => { if (ev.target.hasAttribute && ev.target.hasAttribute('data-check')) check(ev.target); });
/* redesenha a lista sem perder o foco da busca */
function refazLista(sel) {
  const el = $(sel), pos = el ? el.selectionStart : 0;
  renderConteudo();
  const n = $(sel); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ok */ } }
}
document.addEventListener('keydown', ev => {
  if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && PAINEL && PAINEL.tipo === 'op' && !$('#popRaiz').innerHTML && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) {
    const b = $('[data-a="navOp"][data-d="' + (ev.key === 'ArrowRight' ? 1 : -1) + '"]'); if (b && !b.disabled) b.click(); return;
  }
  if (ev.key !== 'Escape') return;
  if ($('#popRaiz').innerHTML) closePopup();
  else if (UI.menu) { UI.menu = ''; renderTopo(); }
  else if (PAINEL) fecharPainel();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && DB && !OCUPADO && Date.now() - CARREGOU_EM > 60000 && !PAINEL && !(LINKS && LINKS.mexeu)) carregar();
});

/* =================== início =================== */
try { if (localStorage.getItem('tema') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { /* sem armazenamento */ }
carregar();
</script>
